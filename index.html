
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#AD7966">
<title>Flamingo Café-Restaurant | Club</title>

<style>
:root {
  --terracotta: #AD7966;
  --terracotta-dark: #865747;
  --terracotta-light: #D0A18D;
  --beige: #E9D8CB;
  --cream: #FBF7F2;
  --white: #FFFFFF;
  --text: #382A25;
  --muted: #86736A;
  --border: #E8DCD3;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--cream);
  color: var(--text);
}

button, input { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--terracotta);
  outline-offset: 3px;
}

/* AUTHENTIFICATION */

.auth-screen {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 35px;
  padding: 35px;
  background: linear-gradient(135deg, #93634F, #C39A85);
}

.brand {
  color: white;
  text-align: center;
  padding: 20px;
}

.brand img {
  width: min(100%, 440px);
  display: block;
  margin: auto;
  border-radius: 8px;
}

.brand h1 {
  font-size: 35px;
  letter-spacing: 5px;
  font-weight: 400;
  margin: 25px 0 10px;
}

.brand p {
  line-height: 1.8;
  max-width: 400px;
  margin: auto;
  color: #FFF4EC;
}

.auth-card {
  width: 100%;
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 15px 50px #57372825;
}

.auth-card h2 { margin-top: 0; }

.subtitle {
  color: var(--muted);
  line-height: 1.6;
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin: 24px 0;
  background: var(--cream);
  padding: 5px;
  border-radius: 10px;
}

.tabs button {
  flex: 1;
  border: none;
  padding: 12px 5px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
}

.tabs button.active {
  background: var(--terracotta);
  color: white;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 15px 0 7px;
}

.field {
  width: 100%;
  border: 1px solid var(--border);
  background: #FFFCF9;
  border-radius: 9px;
  padding: 13px;
}

.primary {
  background: var(--terracotta);
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 9px;
  font-weight: bold;
}

.primary:hover { background: var(--terracotta-dark); }

.full { width: 100%; margin-top: 20px; }

.message {
  margin-top: 12px;
  color: var(--terracotta-dark);
  font-size: 13px;
  line-height: 1.6;
}

/* APPLICATION */

.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  min-height: 75px;
  padding: 12px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  color: var(--terracotta-dark);
}

.logo img {
  width: 55px;
  height: 48px;
  object-fit: contain;
}

.user-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  background: var(--beige);
  color: var(--terracotta-dark);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: bold;
}

.outline {
  background: white;
  border: 1px solid var(--border);
  color: var(--terracotta-dark);
  border-radius: 8px;
  padding: 9px 12px;
}

.layout {
  max-width: 1400px;
  margin: auto;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
}

.sidebar {
  background: white;
  border-right: 1px solid var(--border);
  min-height: calc(100vh - 75px);
  padding: 25px 13px;
}

.nav-btn {
  width: 100%;
  display: flex;
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 14px;
  margin-bottom: 6px;
  border: none;
  border-radius: 9px;
  color: var(--muted);
  background: transparent;
  font-weight: bold;
}

.nav-btn.active, .nav-btn:hover {
  background: var(--beige);
  color: var(--terracotta-dark);
}

.content {
  min-width: 0;
  padding: 35px;
}

.hero {
  background: linear-gradient(120deg, #98664F, #C49A83);
  color: white;
  padding: 38px;
  border-radius: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.hero small {
  letter-spacing: 3px;
  font-weight: bold;
}

.hero h1 {
  font-size: clamp(28px, 4vw, 43px);
  margin: 15px 0;
  font-weight: 500;
}

.hero p {
  line-height: 1.7;
  color: #FFF1E8;
}

.hero .primary {
  background: var(--cream);
  color: var(--terracotta-dark);
}

.hero-symbol {
  font-size: 85px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 30px 0 17px;
}

.section-heading h2 { margin: 0; font-size: 22px; }

.muted {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 17px;
}

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.card-art {
  height: 135px;
  display: grid;
  place-items: center;
  font-size: 48px;
  background: linear-gradient(135deg, #E4C7B6, #F6EAE0);
}

.card-art.dark {
  background: linear-gradient(135deg, #93634F, #C39A85);
}

.card-art.beige {
  background: linear-gradient(135deg, #E4D1BC, #F8F0E6);
}

.card-body { padding: 17px; }

.tag {
  display: inline-block;
  background: var(--beige);
  color: var(--terracotta-dark);
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: bold;
}

.card h3 { font-size: 17px; }

.card p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.card-link {
  border: none;
  background: transparent;
  color: var(--terracotta-dark);
  font-weight: bold;
  padding: 5px 0;
}

/* CARTE DE FIDELITE */

.loyalty-card {
  background: linear-gradient(130deg, #704838, #AD7966 70%, #CBA18A);
  border-radius: 18px;
  padding: 28px;
  color: white;
  max-width: 650px;
}

.loyalty-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.loyalty-logo {
  width: 70px;
  height: 60px;
  object-fit: contain;
  background: white;
  border-radius: 8px;
}

.loyalty-card h2 { margin-top: 28px; }

.member-id {
  color: #F4DFD3;
  font-size: 12px;
  letter-spacing: 2px;
}

.loyalty-bottom {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 20px;
}

.points {
  font-size: 32px;
  font-weight: bold;
}

.qr-box {
  width: 90px;
  height: 90px;
  display: grid;
  place-items: center;
  background: white;
  color: var(--terracotta-dark);
  border-radius: 8px;
  text-align: center;
  font-size: 11px;
  font-weight: bold;
}

.notice {
  background: #F4E8DE;
  border-radius: 10px;
  padding: 15px;
  margin: 20px 0;
  color: #755340;
  font-size: 13px;
  line-height: 1.7;
}

.profile-box {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 25px;
  max-width: 650px;
}

.footer {
  padding: 25px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}

/* MOBILE */

@media(max-width: 850px) {
  .auth-screen {
    grid-template-columns: 1fr;
    padding: 20px;
    gap: 10px;
  }

  .brand img { width: min(70%, 300px); }
  .brand h1 { font-size: 26px; margin: 12px; }
  .brand p { font-size: 13px; }
  .auth-card { max-width: 500px; }

  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    z-index: 10;
    bottom: 0;
    left: 0;
    right: 0;
    min-height: auto;
    display: flex;
    justify-content: space-around;
    padding: 7px 3px;
    border-right: 0;
    border-top: 1px solid var(--border);
  }

  .nav-btn {
    flex: 1;
    width: auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    font-size: 10px;
    padding: 8px 2px;
    margin: 0;
  }

  .content { padding: 20px 14px 100px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { padding: 24px; }
  .hero-symbol { font-size: 55px; }
}

@media(max-width: 520px) {
  .cards { grid-template-columns: 1fr; }
  .hero-symbol { display: none; }
  .hero { padding: 23px; }
  .auth-card { padding: 24px; }
  .logo { letter-spacing: 1px; font-size: 13px; }
  .logo img { width: 42px; }
  .topbar { padding: 10px; }
  .outline { padding: 8px; font-size: 12px; }
}
</style>
</head>

<body>

<!-- CONNEXION -->
<section id="authScreen" class="auth-screen">

  <div class="brand">
    <img src="logo.png" alt="Flamingo Café-Restaurant">
    <h1>FLAMINGO CLUB</h1>
    <p>Votre moment, votre plaisir.</p>
  </div>

  <div class="auth-card">
    <h2 id="authTitle">Bienvenue !</h2>
    <p class="subtitle" id="authSubtitle">
      Connectez-vous à votre espace Flamingo.
    </p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">Connexion</button>
      <button id="registerTab" type="button">Créer un compte</button>
    </div>

    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Nom complet</label>
        <input class="field" id="fullName" autocomplete="name"
               placeholder="Votre nom complet">
      </div>

      <label for="email">Adresse e-mail</label>
      <input class="field" id="email" type="email"
             autocomplete="email" placeholder="vous@exemple.com" required>

      <label for="password">Mot de passe</label>
      <input class="field" id="password" type="password"
             minlength="6" autocomplete="current-password"
             placeholder="6 caractères minimum" required>

      <div id="confirmField" class="hidden">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input class="field" id="confirmPassword" type="password"
               minlength="6" placeholder="Répétez le mot de passe">
      </div>

      <button class="primary full" id="authSubmit" type="submit">
        Se connecter
      </button>
    </form>

    <div id="authMessage" class="message" role="status"></div>

    <p class="muted" style="font-size:11px">
      Version de démonstration : Supabase sera connecté dans la prochaine étape.
    </p>
  </div>
</section>

<!-- APPLICATION -->
<div id="appScreen" class="hidden">

  <header class="topbar">
    <div class="logo">
      <img src="logo.png" alt="Flamingo">
      <span>FLAMINGO CLUB</span>
    </div>

    <div class="user-actions">
      <div class="avatar" id="topUser">F</div>
      <button class="outline" id="logoutBtn" type="button">
        Déconnexion
      </button>
    </div>
  </header>

  <div class="layout">

    <nav class="sidebar" aria-label="Navigation">
      <button class="nav-btn active" data-page="home">🏠 Accueil</button>
      <button class="nav-btn" data-page="events">🎶 Soirées</button>
      <button class="nav-btn" data-page="offers">✨ Offres</button>
      <button class="nav-btn" data-page="loyalty">💳 Fidélité</button>
      <button class="nav-btn" data-page="games">🎁 Jeux</button>
      <button class="nav-btn" data-page="profile">👤 Profil</button>
    </nav>

    <main id="mainContent" class="content"></main>
  </div>

  <footer class="footer">
    FLAMINGO CAFÉ-RESTAURANT · VOTRE MOMENT, VOTRE PLAISIR
  </footer>
</div>

<script>
let mode = "login";
let currentUser = {
  name: "Membre Flamingo",
  email: "",
  id: "DEMO-0001"
};
let activePage = "home";

const $ = id => document.getElementById(id);

function setMode(nextMode) {
  mode = nextMode;
  const register = mode === "register";

  $("loginTab").classList.toggle("active", !register);
  $("registerTab").classList.toggle("active", register);

  $("nameField").classList.toggle("hidden", !register);
  $("confirmField").classList.toggle("hidden", !register);

  $("fullName").required = register;
  $("confirmPassword").required = register;

  $("authTitle").textContent = register
    ? "Rejoignez le club"
    : "Bienvenue !";

  $("authSubtitle").textContent = register
    ? "Créez votre compte Flamingo Club."
    : "Connectez-vous à votre espace Flamingo.";

  $("authSubmit").textContent = register
    ? "Créer mon compte"
    : "Se connecter";

  $("authMessage").textContent = "";
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("registerTab").addEventListener("click", () => setMode("register"));

$("authForm").addEventListener("submit", event => {
  event.preventDefault();

  const email = $("email").value.trim();
  const password = $("password").value;

  if (mode === "register") {
    if ($("fullName").value.trim().length < 2) {
      $("authMessage").textContent = "Entrez votre nom complet.";
      return;
    }

    if (password !== $("confirmPassword").value) {
      $("authMessage").textContent =
        "Les mots de passe ne correspondent pas.";
      return;
    }

    $("authMessage").textContent =
      "Le formulaire est prêt. La création réelle du compte sera activée avec Supabase.";
    return;
  }

  $("authMessage").textContent =
    "La connexion réelle sera activée avec Supabase. Utilisez la prévisualisation pour tester le design.";

  if (!$("demoBtn")) {
    const button = document.createElement("button");
    button.id = "demoBtn";
    button.type = "button";
    button.className = "primary full";
    button.textContent = "Prévisualiser l'application";
    button.onclick = () => enterDemo(email);
    $("authForm").after(button);
  }
});

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function enterDemo(email) {
  currentUser.email = email || "membre@flamingo.example";
  currentUser.name = email
    ? email.split("@")[0]
    : "Membre Flamingo";

  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("topUser").textContent =
    currentUser.name.charAt(0).toUpperCase();

  renderPage(activePage);
}

$("logoutBtn").addEventListener("click", () => {
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
  $("authMessage").textContent =
    "Vous avez quitté la prévisualisation.";

  const demo = $("demoBtn");
  if (demo) demo.remove();
});

const events = [
  {
    icon: "🎶",
    tag: "SOIRÉE MUSICALE",
    title: "Live Music",
    desc: "Une ambiance musicale pour vos moments Flamingo.",
    style: "dark"
  },
  {
    icon: "✨",
    tag: "PROCHAINEMENT",
    title: "Flamingo Night",
    desc: "Retrouvez les détails de notre prochaine soirée.",
    style: ""
  },
  {
    icon: "🥂",
    tag: "ÉVÉNEMENT PRIVÉ",
    title: "Vos célébrations",
    desc: "Partagez vos moments spéciaux chez Flamingo.",
    style: "beige"
  }
];

const offers = [
  {
    icon: "🍕",
    tag: "GOURMANDISE",
    title: "Nos spécialités",
    desc: "Découvrez les spécialités de notre restaurant.",
    style: "beige"
  },
  {
    icon: "☕",
    tag: "PAUSE CAFÉ",
    title: "Café & boissons",
    desc: "Une pause agréable dans votre café préféré.",
    style: ""
  },
  {
    icon: "🍽️",
    tag: "À PARTAGER",
    title: "Moments gourmands",
    desc: "Des instants à savourer entre amis.",
    style: "dark"
  }
];

function card(item) {
  return `
    <article class="card">
      <div class="card-art ${item.style}">${item.icon}</div>
      <div class="card-body">
        <span class="tag">${item.tag}</span>
        <h3>${item.title}</h3>
        <p>${item.desc}</p>
        <button class="card-link" type="button" onclick="showInfo()">
          En savoir plus →
        </button>
      </div>
    </article>`;
}

function showInfo() {
  alert("Les informations seront gérées depuis le tableau Admin.");
}

function goPage(page) {
  activePage = page;
  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });
  renderPage(page);
}

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => goPage(button.dataset.page));
});

function renderPage(page) {
  const main = $("mainContent");

  if (page === "home") {
    main.innerHTML = `
      <section class="hero">
        <div>
          <small>BIENVENUE AU FLAMINGO CLUB</small>
          <h1>Votre moment,<br>votre plaisir.</h1>
          <p>Bonjour ${escapeHTML(currentUser.name)} !
          Découvrez nos soirées et vos offres Flamingo.</p>
          <button class="primary" onclick="goPage('offers')">
            Découvrir les offres
          </button>
        </div>
        <div class="hero-symbol">☕</div>
      </section>

      <div class="section-heading">
        <div>
          <h2>Les soirées</h2>
          <p class="muted">Les bons moments commencent ici.</p>
        </div>
        <button class="outline" onclick="goPage('events')">Tout voir</button>
      </div>
      <div class="cards">${events.slice(0,2).map(card).join("")}</div>

      <div class="section-heading">
        <div>
          <h2>Les offres</h2>
          <p class="muted">Des plaisirs à partager.</p>
        </div>
        <button class="outline" onclick="goPage('offers')">Tout voir</button>
      </div>
      <div class="cards">${offers.slice(0,2).map(card).join("")}</div>

      <div class="notice">
        Les événements et offres affichés sont des exemples.
        Les informations officielles seront ajoutées par Flamingo.
      </div>`;
  }

  else if (page === "events") {
    main.innerHTML = `
      <div class="section-heading">
        <h2>Les soirées Flamingo</h2>
      </div>
      <div class="cards">${events.map(card).join("")}</div>
      <div class="notice">
        Les dates, horaires et artistes seront ajoutés par l'administrateur.
      </div>`;
  }

  else if (page === "offers") {
    main.innerHTML = `
      <div class="section-heading">
        <h2>Les offres Flamingo</h2>
      </div>
      <div class="cards">${offers.map(card).join("")}</div>
      <div class="notice">
        Les offres et les prix doivent être confirmés par le restaurant.
      </div>`;
  }

  else if (page === "loyalty") {
    main.innerHTML = `
      <div class="section-heading">
        <h2>Ma carte de fidélité</h2>
      </div>

      <div class="loyalty-card">
        <div class="loyalty-header">
          <div>
            <div style="letter-spacing:2px;font-size:12px">
              FLAMINGO CAFÉ-RESTAURANT
            </div>
            <div style="margin-top:8px">CARTE MEMBRE</div>
          </div>
          <img class="loyalty-logo" src="logo.png" alt="Flamingo">
        </div>

        <h2>${escapeHTML(currentUser.name)}</h2>
        <div class="member-id">MEMBRE · ${currentUser.id}</div>

        <div class="loyalty-bottom">
          <div>
            <div style="font-size:12px">MES POINTS</div>
            <div class="points">0 pts</div>
          </div>
          <div class="qr-box">QR CODE<br>À ACTIVER</div>
        </div>
      </div>

      <div class="notice">
        Cette carte est une maquette. Le QR individuel et les points
        seront activés avec Supabase et un système de validation sécurisé.
      </div>`;
  }

  else if (page === "games") {
    main.innerHTML = `
      <div class="section-heading">
        <h2>Jeux & Tirage au sort</h2>
      </div>

      <div class="cards">
        <article class="card">
          <div class="card-art beige">🎡</div>
          <div class="card-body">
            <span class="tag">BIENTÔT</span>
            <h3>Lucky Wheel</h3>
            <p>Une roue de la chance et des récompenses.</p>
            <button class="card-link" onclick="showInfo()">Bientôt disponible →</button>
          </div>
        </article>

        <article class="card">
          <div class="card-art">🎁</div>
          <div class="card-body">
            <span class="tag">CONCOURS</span>
            <h3>Tirage au sort</h3>
            <p>Découvrez les prochains jeux et leurs conditions.</p>
            <button class="card-link" onclick="showInfo()">En savoir plus →</button>
          </div>
        </article>
      </div>

      <div class="notice">
        Les règles, participations et résultats seront gérés de façon sécurisée.
      </div>`;
  }

  else if (page === "profile") {
    main.innerHTML = `
      <div class="section-heading">
        <h2>Mon profil</h2>
      </div>

      <div class="profile-box">
        <div class="avatar">${escapeHTML(currentUser.name[0].toUpperCase())}</div>

        <label>Nom complet</label>
        <input class="field" value="${escapeHTML(currentUser.name)}" readonly>

        <label>Adresse e-mail</label>
        <input class="field" value="${escapeHTML(currentUser.email)}" readonly>

        <div class="notice">
          La gestion réelle du profil sera activée avec Supabase Auth.
        </div>
      </div>`;
  }
}

setMode("login");
</script>

</body>
</html>
