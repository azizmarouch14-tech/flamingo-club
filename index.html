<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#AD7966">
<title>Flamingo Resto Café | Fidélité, Tampons & PWA</title>

<!-- Configuration PWA -->
<link rel="manifest" href="manifest.json">

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Scanner QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<!-- Générateur QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --terracotta: #AD7966;
  --terracotta-dark: #865747;
  --terracotta-light: #D0A18D;
  --beige: #E9D8CB;
  --cream: #FBF7F2;
  --white: #FFFFFF;
  --text: #382A25;
  --muted: #86736A;
  --border: #E8DCD3;
  --success: #2e7d32;
  --admin: #2c3e50;
  --danger: #c0392b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--cream);
  color: var(--text);
  direction: ltr;
  text-align: left;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--terracotta);
  outline-offset: 3px;
}

/* AUTHENTIFICATION */
.auth-screen {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 35px;
  padding: 35px;
  background: linear-gradient(135deg, #93634F, #C39A85);
}

.brand { color: white; text-align: center; padding: 20px; }
.brand img { width: min(100%, 440px); display: block; margin: auto; border-radius: 8px; }
.brand h1 { font-size: 32px; letter-spacing: 3px; font-weight: bold; margin: 25px 0 5px; }
.brand p.slogan { font-size: 20px; font-weight: bold; color: #FFE8DC; margin: 0 0 15px; }
.brand p.desc { line-height: 1.8; max-width: 400px; margin: auto; color: #FFF4EC; }

.auth-card {
  width: 100%; max-width: 450px; margin: auto; background: white; padding: 35px;
  border-radius: 20px; box-shadow: 0 15px 50px #57372825; text-align: left;
}
.auth-card h2 { margin-top: 0; }
.subtitle { color: var(--muted); line-height: 1.6; font-size: 14px; }

.tabs {
  display: flex; gap: 8px; margin: 24px 0; background: var(--cream); padding: 5px; border-radius: 10px;
}
.tabs button {
  flex: 1; border: none; padding: 12px 5px; border-radius: 8px; background: transparent; color: var(--muted);
}
.tabs button.active { background: var(--terracotta); color: white; }

label { display: block; font-size: 13px; font-weight: bold; margin: 15px 0 7px; text-align: left; }
.field, textarea.field {
  width: 100%; border: 1px solid var(--border); background: #FFFCF9; border-radius: 9px; padding: 13px;
  text-align: left;
}

.primary {
  background: var(--terracotta); color: white; border: none; padding: 13px 18px; border-radius: 9px; font-weight: bold;
}
.primary:hover { background: var(--terracotta-dark); }
.danger-btn { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; }
.danger-btn:hover { background: #962d22; }

.full { width: 100%; margin-top: 20px; }
.message { margin-top: 12px; color: var(--terracotta-dark); font-size: 13px; line-height: 1.6; }

/* APPLICATION */
.topbar {
  background: white; border-bottom: 1px solid var(--border); min-height: 75px; padding: 12px 5%;
  display: flex; align-items: center; justify-content: space-between; gap: 15px;
}
.logo {
  display: flex; align-items: center; gap: 12px; font-weight: bold; letter-spacing: 2px; color: var(--terracotta-dark);
}
.logo img { width: 55px; height: 48px; object-fit: contain; }
.user-actions { display: flex; align-items: center; gap: 10px; }
.avatar {
  background: var(--beige); color: var(--terracotta-dark); width: 38px; height: 38px;
  border-radius: 50%; display: grid; place-items: center; font-weight: bold;
}
.outline {
  background: white; border: 1px solid var(--border); color: var(--terracotta-dark); border-radius: 8px; padding: 9px 12px;
}

.layout { max-width: 1400px; margin: auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
.sidebar { background: white; border-right: 1px solid var(--border); min-height: calc(100vh - 75px); padding: 25px 13px; }
.nav-btn {
  width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px;
  margin-bottom: 6px; border: none; border-radius: 9px; color: var(--muted); background: transparent; font-weight: bold;
}
.nav-btn.active, .nav-btn:hover { background: var(--beige); color: var(--terracotta-dark); }
.nav-btn.admin-link { color: var(--admin); background: #f0f3f4; border: 1px solid #d5dbdb; }

.content { min-width: 0; padding: 35px; text-align: left; }

.hero {
  background: linear-gradient(120deg, #98664F, #C49A83); color: white; padding: 38px;
  border-radius: 17px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.hero small { letter-spacing: 2px; font-weight: bold; font-size: 16px; color: #FFE8DC; }
.hero h1 { font-size: clamp(28px, 4vw, 43px); margin: 15px 0; font-weight: 500; }
.hero p { line-height: 1.7; color: #FFF1E8; }
.hero .primary { background: var(--cream); color: var(--terracotta-dark); }
.hero-symbol { font-size: 85px; }

.section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 30px 0 17px; }
.section-heading h2 { margin: 0; font-size: 22px; }

.muted { color: var(--muted); font-size: 14px; line-height: 1.6; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
.card { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; text-align: left; position: relative; }
.card-art { height: 160px; display: grid; place-items: center; background: linear-gradient(135deg, #E4C7B6, #F6EAE0); overflow: hidden; }
.card-art img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 17px; }
.tag { display: inline-block; background: var(--beige); color: var(--terracotta-dark); padding: 5px 9px; border-radius: 20px; font-size: 10px; font-weight: bold; }
.card h3 { font-size: 17px; margin: 8px 0; }
.card p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; }

/* CARTE DE FIDÉLITÉ TAMPONS & QR CODE */
.loyalty-container {
  background: linear-gradient(130deg, #704838, #AD7966 70%, #CBA18A);
  border-radius: 18px;
  padding: 28px;
  color: white;
  max-width: 600px;
  margin-bottom: 20px;
}
.loyalty-bottom {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.qr-display {
  background: white;
  padding: 10px;
  border-radius: 8px;
  display: inline-block;
}
.stamps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 20px 0; max-width: 500px; }
.stamp-box {
  background: white; border: 2px dashed var(--terracotta-light); border-radius: 10px; height: 65px;
  display: grid; place-items: center; font-size: 22px; font-weight: bold; color: var(--muted);
}
.stamp-box.filled { background: var(--beige); border: 2px solid var(--terracotta); color: var(--terracotta-dark); }
.stamp-box.gift { background: linear-gradient(135deg, #AD7966, #865747); color: white; border: 2px solid #865747; }

/* BOUTIQUE MAGASIN */
.rewards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; max-width: 650px; margin-top: 15px; }
.reward-card { background: white; border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; }
.reward-card h4 { margin: 10px 0 5px; color: var(--terracotta-dark); }
.reward-card p { font-size: 12px; color: var(--muted); margin-bottom: 15px; }

/* ROULETTE SVG */
.wheel-wrapper { position: relative; width: 290px; height: 290px; margin: 20px auto; }
.wheel-pointer {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 26px solid #d9534f;
  z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}
.wheel-svg-box { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 8px 25px rgba(0,0,0,0.18); transition: transform 4s cubic-bezier(0.15, 0.95, 0.15, 1); }
.wheel-center-btn {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 55px; height: 55px; background: white; border-radius: 50%; border: 4px solid var(--terracotta-dark);
  z-index: 5; display: grid; place-items: center; font-size: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* HISTORIQUE TABLE */
.history-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
.history-table th, .history-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
.history-table th { background: var(--beige); color: var(--terracotta-dark); }

/* DASHBOARD ADMIN */
.stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
.stat-card { background: white; border: 1px solid var(--border); padding: 20px; border-radius: 12px; text-align: center; }
.stat-number { font-size: 32px; font-weight: bold; color: var(--terracotta-dark); margin-top: 5px; }

.scan-box, .admin-section {
  background: white; border: 1px solid var(--border); border-radius: 15px; padding: 25px; max-width: 800px; margin-bottom: 30px; text-align: left;
}
.result-card { background: var(--cream); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 20px; text-align: left; }

.wheel-container { text-align: center; background: white; border: 1px solid var(--border); border-radius: 15px; padding: 30px; max-width: 500px; margin: auto; }
.notice { background: #F4E8DE; border-radius: 10px; padding: 15px; margin: 20px 0; color: #755340; font-size: 13px; line-height: 1.7; text-align: left; }
.profile-box { background: white; border: 1px solid var(--border); border-radius: 15px; padding: 25px; max-width: 650px; text-align: left; }
.footer { padding: 25px; text-align: center; font-size: 12px; color: var(--muted); }

/* MOBILE */
@media(max-width: 850px) {
  .auth-screen { grid-template-columns: 1fr; padding: 20px; gap: 10px; }
  .layout { grid-template-columns: 1fr; }
  .stat-cards { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; z-index: 10; bottom: 0; left: 0; right: 0; min-height: auto;
    display: flex; justify-content: space-around; padding: 7px 3px; background: white; border-top: 1px solid var(--border); border-right: 0;
  }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 10px; padding: 8px 2px; margin: 0; }
  .content { padding: 20px 14px 100px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media(max-width: 520px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>

<body>

<!-- AUTHENTIFICATION -->
<section id="authScreen" class="auth-screen">
  <div class="brand">
    <img src="logo.png" alt="Flamingo Resto Café">
    <h1>FLAMINGO RESTO CAFÉ</h1>
    <p class="slogan">✨ Flamingo يا مدللتنا ✨</p>
    <p class="desc">« جوّك، وقتاك، وشيختك معانا »</p>
  </div>

  <div class="auth-card">
    <h2 id="authTitle">Bienvenue !</h2>
    <p class="subtitle" id="authSubtitle">Connectez-vous à votre espace Flamingo.</p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">Connexion</button>
      <button id="registerTab" type="button">Créer un compte</button>
    </div>

    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Nom complet</label>
        <input class="field" id="fullName" autocomplete="name" placeholder="Votre nom complet">
      </div>

      <label for="email">Adresse e-mail</label>
      <input class="field" id="email" type="email" autocomplete="email" placeholder="exemple@gmail.com" required>

      <label for="password">Mot de passe</label>
      <input class="field" id="password" type="password" minlength="6" autocomplete="current-password" placeholder="6 caractères minimum" required>

      <div id="confirmField" class="hidden">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input class="field" id="confirmPassword" type="password" minlength="6" placeholder="Répétez votre mot de passe">
      </div>

      <button class="primary full" id="authSubmit" type="submit">Se connecter</button>
    </form>

    <div id="authMessage" class="message" role="status"></div>
  </div>
</section>

<!-- APPLICATION -->
<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="logo">
      <img src="logo.png" alt="Flamingo Resto Café">
      <span>FLAMINGO RESTO CAFÉ</span>
    </div>
    <div class="user-actions">
      <div class="avatar" id="topUser">F</div>
      <button class="outline" id="logoutBtn" type="button">Déconnexion</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebarNav" aria-label="Navigation">
      <button class="nav-btn active" data-page="home">🏠 Accueil</button>
      <button class="nav-btn" data-page="events">🎶 Soirées</button>
      <button class="nav-btn" data-page="offers">✨ Offres</button>
      <button class="nav-btn" data-page="loyalty">💳 Carte Fidélité (-20%)</button>
      <button class="nav-btn" data-page="rewards">🎁 Magasin Cadeaux</button>
      <button class="nav-btn" data-page="games">🎡 Roue de la Chance</button>
      <button class="nav-btn" data-page="profile">👤 Mon Profil</button>
    </nav>
    <main id="mainContent" class="content"></main>
  </div>

  <footer class="footer">
    FLAMINGO RESTO CAFÉ · Flamingo يا مدللتنا ✨
  </footer>
</div>

<script>
const SUPABASE_URL = 'https://rwoirkuwvdgsgyxytfmu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RXTtm3S7JyrmgEhe5aX85A_S5IGCheQ';

let supabaseClient = null;
if (window.supabase) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let mode = "login";
let currentUser = { name: "Membre Flamingo", email: "", id: "" };
let activePage = "home";
let eventsList = [];
let offersList = [];
let loyaltyVisits = 0;
let loyaltyQrToken = "";
let html5QrCode = null;

const ADMIN_EMAIL = "azizmrouch@gmail.com";
const $ = id => document.getElementById(id);

function setMode(nextMode) {
  mode = nextMode;
  const register = mode === "register";

  $("loginTab").classList.toggle("active", !register);
  $("registerTab").classList.toggle("active", register);

  $("nameField").classList.toggle("hidden", !register);
  $("confirmField").classList.toggle("hidden", !register);

  $("fullName").required = register;
  $("confirmPassword").required = register;

  $("authTitle").textContent = register ? "Rejoignez-nous !" : "Bienvenue !";
  $("authSubtitle").textContent = register ? "Créer un nouveau compte Flamingo Resto Café." : "Connectez-vous à votre espace Flamingo.";
  $("authSubmit").textContent = register ? "S'inscrire" : "Se connecter";
  $("authMessage").textContent = "";
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("registerTab").addEventListener("click", () => setMode("register"));

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!supabaseClient) {
    $("authMessage").textContent = "Erreur : Connexion à Supabase impossible.";
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;
  $("authMessage").textContent = "Veuillez patienter...";

  if (mode === "register") {
    const fullName = $("fullName").value.trim();
    if (fullName.length < 2) {
      $("authMessage").textContent = "Veuillez saisir votre nom complet.";
      return;
    }
    if (password !== $("confirmPassword").value) {
      $("authMessage").textContent = "Les mots de passe ne correspondent pas.";
      return;
    }

    const { error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: { data: { full_name: fullName } }
    });

    if (error) {
      $("authMessage").textContent = "Erreur : " + error.message;
    } else {
      $("authMessage").textContent = "Compte créé avec succès ! Vous pouvez vous connecter.";
    }
  } else {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      $("authMessage").textContent = "Erreur de connexion : " + error.message;
    } else if (data.user) {
      await loadUserDataAndEnterApp(data.user);
    }
  }
});

async function loadUserDataAndEnterApp(user) {
  currentUser.email = user.email;
  currentUser.id = user.id;

  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('full_name')
    .eq('id', user.id)
    .maybeSingle();

  currentUser.name = profile?.full_name || user.email.split("@")[0];

  const { data: loyalty } = await supabaseClient
    .from('loyalty_cards')
    .select('points, qr_token')
    .eq('user_id', user.id)
    .maybeSingle();

  if (loyalty) {
    loyaltyVisits = loyalty.points || 0; // On utilise la colonne points pour stocker le nombre de tampons (0 à 6)
    loyaltyQrToken = loyalty.qr_token || "";
  }

  await loadContentData();

  const sidebarNav = $("sidebarNav");
  const existingAdminBtn = sidebarNav.querySelector('[data-page="admin"]');
  
  if (currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
    if (!existingAdminBtn) {
      const adminBtn = document.createElement("button");
      adminBtn.className = "nav-btn admin-link";
      adminBtn.dataset.page = "admin";
      adminBtn.innerHTML = "⚙️ Espace Admin";
      adminBtn.addEventListener("click", () => goPage("admin"));
      sidebarNav.appendChild(adminBtn);
    }
  } else if (existingAdminBtn) {
    existingAdminBtn.remove();
  }

  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("topUser").textContent = currentUser.name.charAt(0).toUpperCase();

  renderPage(activePage);
}

async function loadContentData() {
  const { data: evs } = await supabaseClient.from('events').select('*').eq('is_published', true);
  if (evs) eventsList = evs;

  const { data: offs } = await supabaseClient.from('offers').select('*').eq('is_published', true);
  if (offs) offersList = offs;
}

$("logoutBtn").addEventListener("click", async () => {
  if (html5QrCode && html5QrCode.isScanning) {
    await html5QrCode.stop().catch(() => {});
  }
  if (supabaseClient) await supabaseClient.auth.signOut();
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
  $("authMessage").textContent = "Vous êtes déconnecté.";
});

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function card(item) {
  let imgHtml = item.image_url 
    ? `<img src="${escapeHTML(item.image_url)}" alt="${escapeHTML(item.title)}">` 
    : `✨`;

  return `
    <article class="card">
      <div class="card-art">${imgHtml}</div>
      <div class="card-body">
        <span class="tag">FLAMINGO</span>
        <h3>${escapeHTML(item.title)}</h3>
        <p>${escapeHTML(item.description)}</p>
      </div>
    </article>`;
}

async function goPage(page) {
  if (page !== "admin" && html5QrCode && html5QrCode.isScanning) {
    await html5QrCode.stop().catch(() => {});
  }
  if (page === "admin" && currentUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    alert("Accès refusé.");
    return;
  }
  await loadContentData();
  activePage = page;
  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });
  renderPage(page);
}

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => goPage(button.dataset.page));
});

async function renderPage(page) {
  const main = $("mainContent");

  if (page === "home") {
    main.innerHTML = `
      <section class="hero">
        <div>
          <small>🦩 Flamingo يا مدللتنا 🦩</small>
          <h1>Votre moment,<br>votre plaisir.</h1>
          <p>Bonjour ${escapeHTML(currentUser.name)} ! Présentez votre carte à la caisse pour obtenir <strong>20% de réduction</strong>.</p>
          <button class="primary" onclick="goPage('loyalty')">Voir ma Carte & QR Code</button>
        </div>
        <div class="hero-symbol">☕</div>
      </section>

      <div class="section-heading">
        <div><h2>Soirées</h2><p class="muted">Les plus beaux moments commencent ici.</p></div>
        <button class="outline" onclick="goPage('events')">Voir tout</button>
      </div>
      <div class="cards">${eventsList.slice(0,2).map(card).join("") || '<p class="muted">Aucune soirée pour le moment.</p>'}</div>

      <div class="section-heading">
        <div><h2>Offres</h2><p class="muted">Des plaisirs à partager.</p></div>
        <button class="outline" onclick="goPage('offers')">Voir tout</button>
      </div>
      <div class="cards">${offersList.slice(0,2).map(card).join("") || '<p class="muted">Aucune offre pour le moment.</p>'}</div>`;
  } else if (page === "events") {
    main.innerHTML = `
      <div class="section-heading"><h2>Soirées Flamingo Resto Café</h2></div>
      <div class="cards">${eventsList.map(card).join("") || '<p class="muted">Aucune soirée disponible actuellement.</p>'}</div>`;
  } else if (page === "offers") {
    main.innerHTML = `
      <div class="section-heading"><h2>Offres Flamingo Resto Café</h2></div>

  } else if (page === "loyalty") {

    for (let i = 1; i <= 6; i++) {
      const isFilled = i <= loyaltyVisits;
      const isGift = i === 6;
      let cssClass = isGift ? "stamp-box gift" : (isFilled ? "stamp-box filled" : "stamp-box");
      let content = isGift ? "☕" : (isFilled ? "🦩" : i);
      stampsHTML += `<div class="${cssClass}" title="Tampon ${i}">${content}</div>`;
    }

    let statusMsg = loyaltyVisits >= 6 
      ? "🎉 <strong>Félicitations !</strong> Vous avez complété vos 6 tampons. Demandez votre café gratuit à la caisse !" 
      : `Il vous reste ${6 - loyaltyVisits} tampon(s) pour obtenir votre café gratuit !`;

    main.innerHTML = `
      <div class="section-heading"><h2>Carte de Fidélité & Discount 20%</h2></div>
      
      <div class="loyalty-container">
        <div style="font-size:12px; letter-spacing:2px">FLAMINGO RESTO CAFÉ - CARTE FIDÉLITÉ</div>
        <h2>${escapeHTML(currentUser.name)}</h2>
        <p style="font-size: 14px; color: #FFE8DC; margin: 8px 0; font-weight: bold;">⚡ DISCOUNT DE 20% À LA CAISSE SUR PRÉSENTATION DU QR CODE</p>
        
        <div class="loyalty-bottom">
          <div>
            <div style="font-size:12px">TAMPONS (6 MAX)</div>
            <div style="font-size: 24px; font-weight: bold;">${loyaltyVisits} / 6 🦩</div>
          </div>
          <div class="qr-display" id="qrcode"></div>
        </div>
      </div>

      <div class="profile-box" style="max-width:600px;">
        <h3>Progression vers le Café Gratuit</h3>
        <div class="stamps-grid">${stampsHTML}</div>
        <div class="notice">${statusMsg}</div>
      </div>`;

    setTimeout(() => {
      const qrEl = $("qrcode");
      if (qrEl && loyaltyQrToken) {
        qrEl.innerHTML = "";
        new QRCode(qrEl, {
          text: loyaltyQrToken,
          width: 110,
          height: 110
        });
      }
    }, 100);

  } else if (page === "rewards") {
    main.innerHTML = `
      <div class="section-heading"><h2>Magasin Cadeaux Flamingo</h2></div>
      
      <div class="rewards-grid">
        <div class="reward-card">
          <div style="font-size: 32px">☕</div>
          <h4>Café Gratuit</h4>
          <p>Offert à la fin de votre carte de fidélité (6 tampons)</p>
        </div>
        <div class="reward-card">
          <div style="font-size: 32px">🥐</div>
          <h4>Croissant Offert</h4>
          <p>À découvrir via la Roue de la Chance</p>
        </div>
        <div class="reward-card">
          <div style="font-size: 32px">🍹</div>
          <h4>Cocktail -50%</h4>
          <p>Récompense spéciale Roue de la Chance</p>
        </div>
      </div>`;
  } else if (page === "games") {
    main.innerHTML = `
      <div class="section-heading"><h2>Roue de la Chance - Lucky Wheel 🎡</h2></div>
      <div class="wheel-container">
        <p class="muted">Tournez la roue <strong>1 seule fois par jour</strong> pour gagner une surprise !</p>
        
        <div class="wheel-wrapper">
          <div class="wheel-pointer"></div>
          <svg class="wheel-svg-box" id="wheelSvg" viewBox="0 0 200 200">
            <path d="M 100,100 L 100,0 A 100,100 0 0,1 200,100 Z" fill="#865747" />
            <text x="135" y="60" fill="#ffffff" font-size="11" font-weight="bold" transform="rotate(45, 135, 60)">☕ Café</text>
            <path d="M 100,100 L 200,100 A 100,100 0 0,1 100,200 Z" fill="#AD7966" />
            <text x="130" y="145" fill="#ffffff" font-size="10" font-weight="bold" transform="rotate(135, 130, 145)">🥐 Croissant</text>
            <path d="M 100,100 L 100,200 A 100,100 0 0,1 0,100 Z" fill="#C49A83" />
            <text x="50" y="145" fill="#ffffff" font-size="10" font-weight="bold" transform="rotate(225, 50, 145)">🍹 Cocktail</text>
            <path d="M 100,100 L 0,100 A 100,100 0 0,1 100,0 Z" fill="#684234" />
            <text x="50" y="60" fill="#ffffff" font-size="10" font-weight="bold" transform="rotate(315, 50, 60)">🎉 Dommage</text>
          </svg>
          <div class="wheel-center-btn">🦩</div>
        </div>

        <button class="primary" id="spinBtn" onclick="spinWheel()">Tourner la roue</button>
        <div id="wheelResult" class="notice hidden" style="margin-top:20px"></div>
      </div>`;
  } else if (page === "profile") {
    main.innerHTML = `
      <div class="section-heading"><h2>Mon Profil</h2></div>
      <div class="profile-box">
        <div class="avatar">${escapeHTML(currentUser.name[0].toUpperCase())}</div>
        <label>Nom complet</label>
        <input class="field" value="${escapeHTML(currentUser.name)}" readonly>
        <label>Adresse e-mail</label>
        <input class="field" value="${escapeHTML(currentUser.email)}" readonly>
        <label>Avantage Fidélité</label>
        <input class="field" value="Discount 20% à la caisse + 6 Tampons = Café Gratuit" readonly style="font-weight:bold; color:var(--terracotta-dark);">
      </div>`;
  } else if (page === "admin") {
    if (currentUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
      main.innerHTML = `<div class="notice">Accès non autorisé.</div>`;
      return;
    }

    main.innerHTML = `
      <div class="section-heading"><h2>⚙️ Tableau de bord Administrateur</h2></div>
      
      <div class="stat-cards">
        <div class="stat-card">
          <div class="muted">Membres inscrits</div>
          <div class="stat-number" id="statMembers">-</div>
        </div>
        <div class="stat-card">
          <div class="muted">Total Visites / Discounts</div>
          <div class="stat-number" id="statVisits">-</div>
        </div>
        <div class="stat-card">
          <div class="muted">Gestion</div>
          <div class="stat-number">Tampons & QR</div>
        </div>
      </div>

      <!-- SCANNER & VALIDATION DE DISCOUNT / TAMPON -->
      <div class="scan-box">
        <h3>📷 Scanner le QR Code client (-20% & Tampon +1)</h3>
        <p class="muted">Scannez le QR code pour valider le discount de 20% et ajouter un tampon Flamingo (le 6ème offre un café gratuit puis réinitialise la carte).</p>
        
        <div id="reader" style="width: 100%; max-width: 400px; margin: 15px auto;"></div>
        <button class="outline full" id="startScanBtn" onclick="startCameraScan()" style="margin-bottom: 15px;">Démarrer la caméra</button>

        <div style="display: flex; gap: 10px;">
          <input class="field" id="scanInput" placeholder="Ou saisissez le Token ID client ici...">
          <button class="primary" onclick="searchAndValidateMember($('scanInput').value.trim())">Valider & Tamponner</button>
        </div>

        <div id="scanResult" class="result-card hidden"></div>
      </div>

      <!-- GESTION DES SOIRÉES -->
      <div class="admin-section">
        <h3>🎶 Ajouter / Modifier une Soirée</h3>
        <form id="eventForm" onsubmit="saveEvent(event)">
          <input type="hidden" id="eventId">
          <label>Titre de la soirée</label>
          <input class="field" id="eventTitle" placeholder="Ex: Soirée Live Acoustic" required>
          <label>Lien de l'image (URL photo)</label>
          <input class="field" id="eventImage" placeholder="Ex: https://exemple.com/image.jpg">
          <label>Description</label>
          <textarea class="field" id="eventDesc" placeholder="Détails de la soirée..." rows="2" required></textarea>
          <button class="primary full" type="submit">Enregistrer la Soirée</button>
        </form>
        <div style="margin-top: 20px;" id="adminEventsList"></div>
      </div>

      <!-- GESTION DES OFFRES -->
      <div class="admin-section">
        <h3>✨ Ajouter / Modifier une Offre</h3>
        <form id="offerForm" onsubmit="saveOffer(event)">
          <input type="hidden" id="offerId">
          <label>Titre de l'offre</label>
          <input class="field" id="offerTitle" placeholder="Ex: Menu Étudiant -20%" required>
          <label>Lien de l'image (URL photo)</label>
          <input class="field" id="offerImage" placeholder="Ex: https://exemple.com/image.jpg">
          <label>Description</label>
          <textarea class="field" id="offerDesc" placeholder="Détails de l'offre..." rows="2" required></textarea>
          <button class="primary full" type="submit">Enregistrer l'Offre</button>
        </form>
        <div style="margin-top: 20px;" id="adminOffersList"></div>
      </div>

      <!-- HISTORIQUE DES VISITES -->
      <div class="admin-section">
        <h3>📅 Historique des Visites & Discounts (Jour par Jour)</h3>
        <div style="overflow-x: auto;">
          <table class="history-table">
            <thead>
              <tr>
                <th>Date & Heure</th>
                <th>Nom du Client</th>
                <th>Statut</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <tr><td colspan="3" style="text-align:center;">Chargement de l'historique...</td></tr>
            </tbody>
          </table>
        </div>
      </div>`;

    supabaseClient.from('profiles').select('*', { count: 'exact', head: true }).then(({ count }) => {
      if ($('statMembers'))$('statMembers').textContent = count || 0;
    });
    supabaseClient.from('visits').select('*', { count: 'exact', head: true }).then(({ count }) => {
      if ($('statVisits'))$('statVisits').textContent = count || 0;
    });

    loadAdminManagementLists();
    loadVisitsHistory();
  }
}

// GESTION DES SOIRÉES ET OFFRES
async function loadAdminManagementLists() {
  await loadContentData();
  
  const evContainer = $("adminEventsList");
  if (evContainer) {
    evContainer.innerHTML = eventsList.map(e => `
      <div style="display:flex; justify-content:space-between; align-items:center; background:var(--cream); padding:10px 15px; border-radius:8px; margin-bottom:8px;">
        <div><strong>${escapeHTML(e.title)}</strong><br><small class="muted">${escapeHTML(e.description)}</small></div>
        <div style="display:flex; gap:8px;">
          <button class="outline" onclick="editEvent('${e.id}', '${escapeHTML(e.title)}', '${escapeHTML(e.description)}', '${escapeHTML(e.image_url || '')}')">Modifier</button>
          <button class="danger-btn" onclick="deleteItem('events', '${e.id}')">Supprimer</button>
        </div>
      </div>
    `).join("") || '<p class="muted">Aucune soirée enregistrée.</p>';
  }

  const offContainer = $("adminOffersList");
  if (offContainer) {
    offContainer.innerHTML = offersList.map(o => `
      <div style="display:flex; justify-content:space-between; align-items:center; background:var(--cream); padding:10px 15px; border-radius:8px; margin-bottom:8px;">
        <div><strong>${escapeHTML(o.title)}</strong><br><small class="muted">${escapeHTML(o.description)}</small></div>
        <div style="display:flex; gap:8px;">
          <button class="outline" onclick="editOffer('${o.id}', '${escapeHTML(o.title)}', '${escapeHTML(o.description)}', '${escapeHTML(o.image_url || '')}')">Modifier</button>
          <button class="danger-btn" onclick="deleteItem('offers', '${o.id}')">Supprimer</button>
        </div>
      </div>
    `).join("") || '<p class="muted">Aucune offre enregistrée.</p>';
  }
}

async function saveEvent(e) {
  e.preventDefault();
  const id = $("eventId").value;
  const title = $("eventTitle").value;
  const image_url = $("eventImage").value;
  const description = $("eventDesc").value;

  if (id) {
    await supabaseClient.from('events').update({ title, image_url, description }).eq('id', id);
  } else {
    await supabaseClient.from('events').insert({ title, image_url, description, is_published: true });
  }
  $("eventForm").reset();
  $("eventId").value = "";
  loadAdminManagementLists();
}

function editEvent(id, title, desc, img) {
  $("eventId").value = id;
  $("eventTitle").value = title;
  $("eventImage").value = img;
  $("eventDesc").value = desc;
}

async function saveOffer(e) {
  e.preventDefault();
  const id = $("offerId").value;
  const title = $("offerTitle").value;
  const image_url = $("offerImage").value;
  const description = $("offerDesc").value;

  if (id) {
    await supabaseClient.from('offers').update({ title, image_url, description }).eq('id', id);
  } else {
    await supabaseClient.from('offers').insert({ title, image_url, description, is_published: true });
  }
  $("offerForm").reset();
  $("offerId").value = "";
  loadAdminManagementLists();
}

function editOffer(id, title, desc, img) {
  $("offerId").value = id;
  $("offerTitle").value = title;
  $("offerImage").value = img;
  $("offerDesc").value = desc;
}

async function deleteItem(table, id) {
  if (confirm("Voulez-vous vraiment supprimer cet élément ?")) {
    await supabaseClient.from(table).delete().eq('id', id);
    loadAdminManagementLists();
  }
}

// HISTORIQUE DES VISITES
async function loadVisitsHistory() {
  const tbody = $("historyTableBody");
  if (!tbody) return;

  const { data: visits, error } = await supabaseClient
    .from('visits')
    .select('created_at, user_id, profiles(full_name)')
    .order('created_at', { ascending: false });

  if (error || !visits || visits.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;" class="muted">Aucune visite enregistrée pour le moment.</td></tr>`;
    return;
  }

  tbody.innerHTML = visits.map(v => {
    const dateObj = new Date(v.created_at);
    const dateFormatted = dateObj.toLocaleDateString('fr-FR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const timeFormatted = dateObj.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const clientName = v.profiles?.full_name || "Client inconnu";

    return `
      <tr>
        <td><strong>${dateFormatted}</strong> à ${timeFormatted}</td>
        <td>${escapeHTML(clientName)}</td>
        <td><span style="color:var(--success); font-weight:bold;">Discount 20% & Tampon Validés</span></td>
      </tr>
    `;
  }).join("");
}

// SCANNER & VALIDATION DE TAMPON (+1) ET RESET À 6
function startCameraScan() {
  const btn = $("startScanBtn");
  btn.textContent = "Caméra active...";
  btn.disabled = true;

  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    async (decodedText) => {
      $("scanInput").value = decodedText;
      await searchAndValidateMember(decodedText);
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
        btn.textContent = "Démarrer la caméra";
        btn.disabled = false;
      }
    },
    (errorMessage) => {}
  ).catch(err => {
    alert("Problème de caméra : " + err);
    btn.textContent = "Démarrer la caméra";
    btn.disabled = false;
  });
}

async function searchAndValidateMember(token) {
  const res = $("scanResult");
  if (!token) {
    alert("Veuillez saisir ou scanner un code valide.");
    return;
  }

  res.classList.remove("hidden");
  res.innerHTML = "Vérification et validation du discount...";

  const { data: card, error } = await supabaseClient
    .from('loyalty_cards')
    .select('*, profiles(full_name)')
    .eq('qr_token', token)
    .maybeSingle();

  if (error || !card) {
    res.innerHTML = `❌ Client introuvable. Code QR invalide.`;
    return;
  }

  let currentStamps = card.points || 0;
  currentStamps += 1;
  const isGift = currentStamps >= 6;

  await supabaseClient.from('visits').insert({ user_id: card.user_id });

  const newStampsCount = isGift ? 0 : currentStamps;
  await supabaseClient.from('loyalty_cards').update({ points: newStampsCount }).eq('id', card.id);

  let msg = isGift 
    ? `🎉 <strong>Félicitations !</strong> C'est le 6ème tampon pour <strong>${escapeHTML(card.profiles?.full_name)}</strong>. <strong>Offrez-lui son café gratuit !</strong> La carte a été réinitialisée à 0.`
    : `✅ <strong>Discount de 20% appliqué !</strong> Tampon ajouté pour <strong>${escapeHTML(card.profiles?.full_name)}</strong> (<strong>${currentStamps}/6</strong> tampons).`;

  res.innerHTML = msg;

  loadVisitsHistory();
  supabaseClient.from('visits').select('*', { count: 'exact', head: true }).then(({ count }) => {
    if ($('statVisits'))$('statVisits').textContent = count || 0;
  });
}

// ROULETTE DE LA CHANCE
let wheelRotation = 0;

function spinWheel() {
  const wheelSvg = $("wheelSvg");
  const btn = $("spinBtn");
  const resultBox = $("wheelResult");

  const lastPlayedKey = "flamingo_wheel_" + currentUser.id;
  const today = new Date().toISOString().split('T')[0];
  const lastPlayedDate = localStorage.getItem(lastPlayedKey);

  if (lastPlayedDate === today) {
    resultBox.innerHTML = "⏳ <strong>Vous avez déjà tourné la roue aujourd'hui !</strong> Revenez demain pour tenter votre chance 😉";
    resultBox.classList.remove("hidden");
    return;
  }

  btn.disabled = true;
  resultBox.classList.add("hidden");

  const prizes = [
    { text: "☕ Félicitations ! Vous avez gagné un Café offert !", angle: 315 },
    { text: "🥐 Félicitations ! Vous avez gagné un Croissant offert !", angle: 225 },
    { text: "🍹 Félicitations ! Vous avez gagné un Cocktail à -50% !", angle: 135 },
    { text: "🎉 Dommage ! Retentez votre chance demain !", angle: 45 }
  ];

  const selectedPrize = prizes[Math.floor(Math.random() * prizes.length)];
  const fullRounds = 5 * 360;
  wheelRotation += fullRounds + selectedPrize.angle - (wheelRotation % 360);
  
  wheelSvg.style.transform = "rotate(" + wheelRotation + "deg)";

  setTimeout(() => {
    localStorage.setItem(lastPlayedKey, today);

    resultBox.innerHTML = "🎁 <strong>Résultat :</strong> " + selectedPrize.text + "<br><small>Montrez cet écran au comptoir pour en profiter !</small>";
    resultBox.classList.remove("hidden");
    btn.disabled = false;
  }, 4000);
}

if (supabaseClient) {
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      loadUserDataAndEnterApp(session.user);
    }
  });
}

setMode("login");
</script>
