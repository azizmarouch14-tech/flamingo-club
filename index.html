<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#AD7966">
<title>Flamingo Resto Café</title>

<!-- Configuration PWA -->
<link rel="manifest" href="manifest.json">

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Scanner QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<!-- Générateur QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --terracotta: #AD7966;
  --terracotta-dark: #7E4F3F;
  --terracotta-light: #D0A18D;
  --beige: #F4EBE4;
  --cream: #FAF7F5;
  --white: #FFFFFF;
  --text: #2D2320;
  --muted: #7E7069;
  --border: #EFE4DC;
  --success: #2e7d32;
  --admin: #2c3e50;
  --danger: #c0392b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
  direction: ltr;
  text-align: left;
  padding-bottom: 85px; /* Espace pour la barre de navigation mobile */
}

button, input, textarea { font: inherit; }
button { cursor: pointer; border: none; }
.hidden { display: none !important; }

/* ÉCRAN D'AUTHENTIFICATION MOBILE */
.auth-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg, #7E4F3F, #AD7966);
}

.brand { color: white; text-align: center; margin-bottom: 20px; }
.brand img { width: 90px; height: 90px; object-fit: contain; border-radius: 50%; background: white; padding: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin: auto; }
.brand h1 { font-size: 22px; letter-spacing: 2px; font-weight: bold; margin: 12px 0 4px; }
.brand p.slogan { font-size: 15px; font-weight: bold; color: #FFE8DC; margin: 0 0 5px; }
.brand p.desc { font-size: 13px; color: #FFF4EC; margin: 0; opacity: 0.9; }

.auth-card {
  width: 100%; background: white; padding: 24px;
  border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: left;
}
.auth-card h2 { margin-top: 0; font-size: 20px; color: var(--terracotta-dark); }
.subtitle { color: var(--muted); font-size: 13px; margin-bottom: 15px; }

.tabs {
  display: flex; gap: 6px; margin-bottom: 20px; background: var(--cream); padding: 4px; border-radius: 10px;
}
.tabs button {
  flex: 1; padding: 10px; border-radius: 8px; background: transparent; color: var(--muted); font-weight: bold; font-size: 13px;
}
.tabs button.active { background: var(--terracotta); color: white; box-shadow: 0 2px 8px rgba(173,121,102,0.3); }

label { display: block; font-size: 12px; font-weight: bold; margin: 12px 0 5px; color: var(--text); }
.field, textarea.field {
  width: 100%; border: 1px solid var(--border); background: #FAF6F3; border-radius: 10px; padding: 12px; font-size: 14px;
}

.primary {
  background: var(--terracotta); color: white; border-radius: 10px; padding: 13px; font-weight: bold; font-size: 15px; width: 100%; text-align: center;
  box-shadow: 0 4px 12px rgba(173,121,102,0.3);
}
.primary:active { transform: scale(0.98); }
.danger-btn { background: var(--danger); color: white; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: bold; }

.full { margin-top: 15px; }
.message { margin-top: 10px; color: var(--terracotta-dark); font-size: 12px; text-align: center; }

/* TOPBAR MOBILE */
.topbar {
  background: white; border-bottom: 1px solid var(--border); height: 60px; padding: 0 16px;
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 14px; letter-spacing: 1px; color: var(--terracotta-dark); }
.logo img { width: 36px; height: 36px; object-fit: contain; }
.user-actions { display: flex; align-items: center; gap: 8px; }
.avatar { background: var(--beige); color: var(--terracotta-dark); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: bold; font-size: 14px; }
.outline { background: white; border: 1px solid var(--border); color: var(--terracotta-dark); border-radius: 8px; padding: 6px 10px; font-size: 12px; }

/* NAVIGATION MOBILE INFÉRIEURE */
.sidebar {
  position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; padding: 8px 4px; z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: transparent; color: var(--muted); font-size: 10px; font-weight: bold; padding: 4px 0; border-radius: 8px;
}
.nav-btn span.icon { font-size: 18px; }
.nav-btn.active { color: var(--terracotta-dark); background: var(--beige); }
.nav-btn.admin-link { color: var(--admin); }

/* CONTENU PRINCIPAL */
.content { padding: 16px; max-width: 600px; margin: auto; }

.hero {
  background: linear-gradient(135deg, #7E4F3F, #AD7966); color: white; padding: 24px 20px;
  border-radius: 16px; display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 20px;
  box-shadow: 0 8px 20px rgba(126,79,63,0.25);
}
.hero small { letter-spacing: 1px; font-weight: bold; font-size: 12px; color: #FFE8DC; display: block; margin-bottom: 6px; }
.hero h1 { font-size: 22px; margin: 0 0 8px; font-weight: bold; line-height: 1.3; }
.hero p { font-size: 13px; line-height: 1.5; color: #FFF1E8; margin: 0 0 14px; }
.hero .primary { background: white; color: var(--terracotta-dark); width: auto; padding: 8px 16px; font-size: 12px; }
.hero-symbol { font-size: 45px; }

.section-heading { display: flex; justify-content: space-between; align-items: center; margin: 20px 0 12px; }
.section-heading h2 { margin: 0; font-size: 18px; color: var(--text); }
.section-heading button { font-size: 12px; }

.muted { color: var(--muted); font-size: 13px; line-height: 1.5; }

/* CARTES MODERNES */
.cards { display: flex; flex-direction: column; gap: 12px; }
.card { background: white; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
.card-art { height: 140px; background: linear-gradient(135deg, #E4C7B6, #F6EAE0); display: grid; place-items: center; overflow: hidden; font-size: 32px; }
.card-art img { width: 100%; height: 100%; object-fit: cover; }
.card-body { padding: 14px; }
.tag { display: inline-block; background: var(--beige); color: var(--terracotta-dark); padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; margin-bottom: 6px; }
.card h3 { font-size: 15px; margin: 0 0 6px; color: var(--text); }
.card p { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 0; }

/* CARTE VIP FIDÉLITÉ MOBILE */
.loyalty-container {
  background: linear-gradient(135deg, #5A3629, #AD7966);
  border-radius: 16px;
  padding: 20px;
  color: white;
  box-shadow: 0 8px 25px rgba(90,54,41,0.25);
  margin-bottom: 16px;
}
.loyalty-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
.loyalty-bottom { display: flex; justify-content: space-between; align-items: center; gap: 15px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
.qr-display { background: white; padding: 8px; border-radius: 10px; display: inline-block; }

.stamps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
.stamp-box {
  background: white; border: 2px dashed var(--terracotta-light); border-radius: 10px; height: 55px;
  display: grid; place-items: center; font-size: 18px; font-weight: bold; color: var(--muted);
}
.stamp-box.filled { background: var(--beige); border: 2px solid var(--terracotta); color: var(--terracotta-dark); }
.stamp-box.gift { background: linear-gradient(135deg, #AD7966, #7E4F3F); color: white; border: 2px solid #7E4F3F; font-size: 20px; }

/* BOUTIQUE ET ROULETTE */
.rewards-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
.reward-card { background: white; border: 1px solid var(--border); padding: 16px; border-radius: 12px; display: flex; align-items: center; gap: 15px; }
.reward-icon { font-size: 32px; background: var(--beige); width: 55px; height: 55px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
.reward-info h4 { margin: 0 0 3px; font-size: 14px; color: var(--terracotta-dark); }
.reward-info p { margin: 0; font-size: 12px; color: var(--muted); }

.wheel-container { text-align: center; background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
.profile-box { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
.notice { background: #F4E8DE; border-radius: 10px; padding: 12px; margin: 15px 0; color: #7E4F3F; font-size: 12px; line-height: 1.5; text-align: left; }

/* ADMIN & TABLEAUX */
.stat-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-card { background: white; border: 1px solid var(--border); padding: 15px; border-radius: 12px; text-align: center; }
.stat-number { font-size: 24px; font-weight: bold; color: var(--terracotta-dark); margin-top: 4px; }

.scan-box, .admin-section {
  background: white; border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}
.result-card { background: var(--cream); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-top: 15px; }

.history-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.history-table th, .history-table td { padding: 10px; text-align: left; border-bottom: 1px solid var(--border); }
.history-table th { background: var(--beige); color: var(--terracotta-dark); }

.footer { padding: 15px; text-align: center; font-size: 11px; color: var(--muted); }
</style>
</head>

<body>

<!-- AUTHENTIFICATION -->
<section id="authScreen" class="auth-screen">
  <div class="brand">
    <img src="logo.png" alt="Flamingo Resto Café">
    <h1>FLAMINGO RESTO CAFÉ</h1>
    <p class="slogan">✨ Flamingo يا مدللتنا ✨</p>
    <p class="desc">« جوّك، وقتاك، وشيختك معانا »</p>
  </div>

  <div class="auth-card">
    <h2 id="authTitle">Connexion</h2>
    <p class="subtitle" id="authSubtitle">Accédez à votre espace membre VIP.</p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">Connexion</button>
      <button id="registerTab" type="button">Inscription</button>
    </div>

    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Nom complet</label>
        <input class="field" id="fullName" autocomplete="name" placeholder="Votre nom">
      </div>

      <label for="email">Adresse e-mail</label>
      <input class="field" id="email" type="email" autocomplete="email" placeholder="exemple@gmail.com" required>

      <label for="password">Mot de passe</label>
      <input class="field" id="password" type="password" minlength="6" autocomplete="current-password" placeholder="6 caractères min." required>

      <div id="confirmField" class="hidden">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input class="field" id="confirmPassword" type="password" minlength="6" placeholder="Répétez le mot de passe">
      </div>

      <button class="primary full" id="authSubmit" type="submit">Se connecter</button>
    </form>

    <div id="authMessage" class="message" role="status"></div>
  </div>
</section>

<!-- APPLICATION -->
<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="logo">
      <img src="logo.png" alt="Flamingo">
      <span>FLAMINGO</span>
    </div>
    <div class="user-actions">
      <div class="avatar" id="topUser">F</div>
      <button class="outline" id="logoutBtn" type="button">Quitter</button>
    </div>
  </header>

  <main id="mainContent" class="content"></main>

  <nav class="sidebar" id="sidebarNav" aria-label="Navigation">
    <button class="nav-btn active" data-page="home"><span class="icon">🏠</span>Accueil</button>
    <button class="nav-btn" data-page="events"><span class="icon">🎶</span>Soirées</button>
    <button class="nav-btn" data-page="offers"><span class="icon">✨</span>Offres</button>
    <button class="nav-btn" data-page="loyalty"><span class="icon">💳</span>VIP & Tampons</button>
    <button class="nav-btn" data-page="games"><span class="icon">🎡</span>Roue</button>
  </nav>

  <footer class="footer">
    FLAMINGO RESTO CAFÉ · Mahdia ✨
  </footer>
</div>

<script>
const SUPABASE_URL = 'https://rwoirkuwvdgsgyxytfmu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RXTtm3S7JyrmgEhe5aX85A_S5IGCheQ';

let supabaseClient = null;
if (window.supabase) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let mode = "login";
let currentUser = { name: "Membre", email: "", id: "" };
let activePage = "home";
let eventsList = [];
let offersList = [];
let loyaltyVisits = 0;
let loyaltyQrToken = "";
let html5QrCode = null;

const ADMIN_EMAIL = "azizmrouch@gmail.com";
const $ = id => document.getElementById(id);

function setMode(nextMode) {
  mode = nextMode;
  const register = mode === "register";

  $("loginTab").classList.toggle("active", !register);
  $("registerTab").classList.toggle("active", register);

  $("nameField").classList.toggle("hidden", !register);
  $("confirmField").classList.toggle("hidden", !register);

  $("fullName").required = register;
  $("confirmPassword").required = register;

  $("authTitle").textContent = register ? "Inscription" : "Connexion";
  $("authSubtitle").textContent = register ? "Créez votre compte Flamingo VIP." : "Accédez à votre espace membre VIP.";
  $("authSubmit").textContent = register ? "S'inscrire" : "Se connecter";
  $("authMessage").textContent = "";
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("registerTab").addEventListener("click", () => setMode("register"));

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!supabaseClient) {
    $("authMessage").textContent = "Erreur de connexion Supabase.";
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;
  $("authMessage").textContent = "Chargement...";

  if (mode === "register") {
    const fullName = $("fullName").value.trim();
    if (fullName.length < 2) {
      $("authMessage").textContent = "Entrez votre nom complet.";
      return;
    }
    if (password !== $("confirmPassword").value) {
      $("authMessage").textContent = "Mots de passe non identiques.";
      return;
    }

    const { error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: { data: { full_name: fullName } }
    });

    if (error) {
      $("authMessage").textContent = "Erreur : " + error.message;
    } else {
      $("authMessage").textContent = "Compte créé ! Connectez-vous.";
    }
  } else {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      $("authMessage").textContent = "Erreur d'authentification.";
    } else if (data.user) {
      await loadUserDataAndEnterApp(data.user);
    }
  }
});

async function loadUserDataAndEnterApp(user) {
  currentUser.email = user.email;
  currentUser.id = user.id;

  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('full_name')
    .eq('id', user.id)
    .maybeSingle();

  currentUser.name = profile?.full_name || user.email.split("@")[0];

  const { data: loyalty } = await supabaseClient
    .from('loyalty_cards')
    .select('points, qr_token')
    .eq('user_id', user.id)
    .maybeSingle();

  if (loyalty) {
    loyaltyVisits = loyalty.points || 0;
    loyaltyQrToken = loyalty.qr_token || "";
  }

  await loadContentData();

  const sidebarNav = $("sidebarNav");
  const existingAdminBtn = sidebarNav.querySelector('[data-page="admin"]');
  
  if (currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
    if (!existingAdminBtn) {
      const adminBtn = document.createElement("button");
      adminBtn.className = "nav-btn admin-link";
      adminBtn.dataset.page = "admin";
      adminBtn.innerHTML = '<span class="icon">⚙️</span>Admin';
      adminBtn.addEventListener("click", () => goPage("admin"));
      sidebarNav.appendChild(adminBtn);
    }
  } else if (existingAdminBtn) {
    existingAdminBtn.remove();
  }

  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("topUser").textContent = currentUser.name.charAt(0).toUpperCase();

  renderPage(activePage);
}

async function loadContentData() {
  const { data: evs } = await supabaseClient.from('events').select('*').eq('is_published', true);
  if (evs) eventsList = evs;

  const { data: offs } = await supabaseClient.from('offers').select('*').eq('is_published', true);
  if (offs) offersList = offs;
}

$("logoutBtn").addEventListener("click", async () => {
  if (html5QrCode && html5QrCode.isScanning) {
    await html5QrCode.stop().catch(() => {});
  }
  if (supabaseClient) await supabaseClient.auth.signOut();
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
  $("authMessage").textContent = "";
});

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function card(item) {
  let imgHtml = item.image_url 
    ? `<img src="${escapeHTML(item.image_url)}" alt="${escapeHTML(item.title)}">` 
    : `🦩`;

  return `
    <article class="card">
      <div class="card-art">${imgHtml}</div>
      <div class="card-body">
        <span class="tag">FLAMINGO</span>
        <h3>${escapeHTML(item.title)}</h3>
        <p>${escapeHTML(item.description)}</p>
      </div>
    </article>`;
}

async function goPage(page) {
  if (page !== "admin" && html5QrCode && html5QrCode.isScanning) {
    await html5QrCode.stop().catch(() => {});
  }
  if (page === "admin" && currentUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
    alert("Accès réservé à l'administrateur.");
    return;
  }
  await loadContentData();
  activePage = page;
  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });
  renderPage(page);
}

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => goPage(button.dataset.page));
});

async function renderPage(page) {
  const main = $("mainContent");

  if (page === "home") {
    main.innerHTML = `
      <section class="hero">
        <div>
          <small>🦩 Flamingo يا مدللتنا 🦩</small>
          <h1>Votre moment,<br>votre plaisir.</h1>
          <p>Profitez de <strong>20% de réduction</strong> à la caisse avec votre carte VIP.</p>
          <button class="primary" onclick="goPage('loyalty')">Ma Carte VIP</button>
        </div>
        <div class="hero-symbol">☕</div>
      </section>

      <div class="section-heading">
        <h2>Soirées</h2>
        <button class="outline" onclick="goPage('events')">Voir tout</button>
      </div>
      <div class="cards">${eventsList.slice(0,2).map(card).join("") || '<p class="muted">Aucune soirée pour le moment.</p>'}</div>

      <div class="section-heading" style="margin-top:25px;">
        <h2>Offres</h2>
        <button class="outline" onclick="goPage('offers')">Voir tout</button>
      </div>
      <div class="cards">${offersList.slice(0,2).map(card).join("") || '<p class="muted">Aucune offre pour le moment.</p>'}</div>`;
  } else if (page === "events") {
    main.innerHTML = `
      <div class="section-heading"><h2>Soirées Flamingo</h2></div>
      <div class="cards">${eventsList.map(card).join("") || '<p class="muted">Aucune soirée disponible.</p>'}</div>`;
  } else if (page === "offers") {
    main.innerHTML = `
      <div class="section-heading"><h2>Offres Flamingo</h2></div>
      <div class="cards">${offersList.map(card).join("") || '<p class="muted">Aucune offre disponible.</p>'}</div>`;
  } else if (page === "loyalty") {
    let stampsHTML = "";
    for (let i = 1; i <= 6; i++) {
      const isFilled = i <= loyaltyVisits;
      const isGift = i === 6;
      let cssClass = isGift ? "stamp-box gift" : (isFilled ? "stamp-box filled" : "stamp-box");
      let content = isGift ? "☕" : (isFilled ? "🦩" : i);
      stampsHTML += `<div class="${cssClass}">${content}</div>`;
    }

    let statusMsg = loyaltyVisits >= 6 
      ? "🎉 <strong>Félicitations !</strong> 6 tampons atteints. Demandez votre café gratuit à la caisse !" 
      : `Il vous reste ${6 - loyaltyVisits} tampon(s) pour obtenir votre café gratuit !`;

    main.innerHTML = `
      <div class="section-heading"><h2>Carte Fidélité & VIP</h2></div>
      
      <div class="loyalty-container">
        <div class="loyalty-top">
          <div>
            <div style="font-size:10px; letter-spacing:1px; opacity:0.8;">FLAMINGO RESTO CAFÉ</div>
            <h2 style="margin:4px 0 0; font-size:18px;">${escapeHTML(currentUser.name)}</h2>
          </div>
          <span style="background:rgba(255,255,255,0.2); padding:4px 8px; border-radius:6px; font-size:11px; font-weight:bold;">-20% VIP</span>
        </div>
        
        <p style="font-size: 11px; color: #FFE8DC; margin: 0 0 10px;">Présentez ce QR code à la caisse pour le discount et vos tampons.</p>
        
        <div class="loyalty-bottom">
          <div>
            <div style="font-size:10px; opacity:0.8;">TAMPONS</div>
            <div style="font-size: 20px; font-weight: bold;">${loyaltyVisits} / 6 🦩</div>
          </div>
          <div class="qr-display" id="qrcode"></div>
        </div>
      </div>

      <div class="profile-box">
        <h3 style="margin:0 0 10px; font-size:15px;">Progression Tampons</h3>
        <div class="stamps-grid">${stampsHTML}</div>
        <div class="notice">${statusMsg}</div>
      </div>`;

    setTimeout(() => {
      const qrEl = $("qrcode");
      if (qrEl && loyaltyQrToken) {
        qrEl.innerHTML = "";
        new QRCode(qrEl, {
          text: loyaltyQrToken,
          width: 95,
          height: 95
        });
      }
    }, 100);

  } else if (page === "rewards") {
    main.innerHTML = `
      <div class="section-heading"><h2>Magasin Cadeaux</h2></div>
      <div class="rewards-grid">
        <div class="reward-card">
          <div class="reward-icon">☕</div>
          <div class="reward-info">
            <h4>Café Gratuit</h4>
            <p>Offert au 6ème tampon de fidélité</p>
          </div>
        </div>
        <div class="reward-card">
          <div class="reward-icon">🥐</div>
          <div class="reward-info">
            <h4>Croissant Offert</h4>
            <p>À gagner via la Roue de la Chance</p>
          </div>
        </div>
        <div class="reward-card">
          <div class="reward-icon">🍹</div>
          <div class="reward-info">
            <h4>Cocktail -50%</h4>
            <p>Surprise spéciale Roue de la Chance</p>
          </div>
        </div>
      </div>`;
  } else if (page === "games") {
    main.innerHTML = `
      <div class="section-heading"><h2>Roue de la Chance 🎡</h2></div>
      <div class="wheel-container">
        <p class="muted" style="margin-top:0; font-size:12px;">Tournez la roue <strong>1 fois par jour</strong> pour gagner une surprise !</p>
        
        <div class="wheel-wrapper">
          <div class="wheel-pointer"></div>
          <svg class="wheel-svg-box" id="wheelSvg" viewBox="0 0 200 200">
            <path d="M 100,100 L 100,0 A 100,100 0 0,1 200,100 Z" fill="#7E4F3F" />
            <text x="135" y="60" fill="#ffffff" font-size="11" font-weight="bold" transform="rotate(45, 135, 60)">☕ Café</text>
            <path d="M 100,100 L 200,100 A 100,100 0 0,1 100,200 Z" fill="#AD7966" />
            <text x="130" y="145" fill="#ffffff" font-size="10" font-weight="bold" transform="rotate(135, 130, 145)">🥐 Croissant</text>
            <path d="M 100,100 L 100,200 A 100,100 0 0,1 0,100 Z" fill="#D0A18D" />
            <text x="50" y="145" fill="#ffffff" font-size="10" font-weight="bold" transform="rotate(225, 50, 145)">🍹 Cocktail</text>
            <path d="M 100,100 L 0,100 A 100,100 0 0,1 100,0 Z" fill="#5A3629" />
            <text x="50" y="60" fill="#ffffff" font-size="10" font-weight="bold" transform="rotate(315, 50, 60)">🎉 Dommage</text>
          </svg>
          <div class="wheel-center-btn">🦩</div>
        </div>

        <button class="primary" id="spinBtn" onclick="spinWheel()">Tourner la roue</button>
        <div id="wheelResult" class="notice hidden" style="margin-top:15px"></div>
      </div>`;
  } else if (page === "profile") {
    main.innerHTML = `
      <div class="section-heading"><h2>Mon Profil</h2></div>
      <div class="profile-box">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px;">
          <div class="avatar" style="width:45px; height:45px; font-size:18px;">${escapeHTML(currentUser.name[0].toUpperCase())}</div>
          <div>
            <h3 style="margin:0; font-size:16px;">${escapeHTML(currentUser.name)}</h3>
            <p style="margin:2px 0 0; font-size:12px; color:var(--muted);">${escapeHTML(currentUser.email)}</p>
          </div>
        </div>
        <label>Statut</label>
        <input class="field" value="Membre VIP Flamingo Resto Café" readonly style="font-weight:bold; color:var(--terracotta-dark);">
      </div>`;
  } else if (page === "admin") {
    if (currentUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
      main.innerHTML = `<div class="notice">Accès non autorisé.</div>`;
      return;
    }

    main.innerHTML = `
      <div class="section-heading"><h2>⚙️ Espace Administrateur</h2></div>
      
      <div class="stat-cards">
        <div class="stat-card">
          <div class="muted">Membres</div>
          <div class="stat-number" id="statMembers">-</div>
        </div>
        <div class="stat-card">
          <div class="muted">Visites</div>
          <div class="stat-number" id="statVisits">-</div>
        </div>
      </div>

      <div class="scan-box">
        <h3 style="margin-top:0; font-size:15px;">📷 Scanner QR Code (-20% & Tampon)</h3>
        <p class="muted" style="font-size:12px;">Scannez le QR code du client pour appliquer la réduction et ajouter 1 tampon.</p>
        
        <div id="reader" style="width: 100%; max-width: 320px; margin: 10px auto;"></div>
        <button class="outline full" id="startScanBtn" onclick="startCameraScan()" style="margin-bottom: 12px;">Activer la caméra</button>

        <div style="display: flex; gap: 8px;">
          <input class="field" id="scanInput" placeholder="Ou saisir le Token ID...">
          <button class="primary" onclick="searchAndValidateMember($('scanInput').value.trim())" style="width:auto; padding:0 12px;">Valider</button>
        </div>

        <div id="scanResult" class="result-card hidden"></div>
      </div>

      <div class="admin-section">
        <h3 style="margin-top:0; font-size:15px;">🎶 Gérer les Soirées</h3>
        <form id="eventForm" onsubmit="saveEvent(event)">
          <input type="hidden" id="eventId">
          <label>Titre</label>
          <input class="field" id="eventTitle" placeholder="Titre de la soirée" required>
          <label>URL Image</label>
          <input class="field" id="eventImage" placeholder="https://...">
          <label>Description</label>
          <textarea class="field" id="eventDesc" placeholder="Description..." rows="2" required></textarea>
          <button class="primary full" type="submit" style="margin-top:10px;">Enregistrer Soirée</button>
        </form>
        <div style="margin-top: 15px;" id="adminEventsList"></div>
      </div>

      <div class="admin-section">
        <h3 style="margin-top:0; font-size:15px;">✨ Gérer les Offres</h3>
        <form id="offerForm" onsubmit="saveOffer(event)">
          <input type="hidden" id="offerId">
          <label>Titre</label>
          <input class="field" id="offerTitle" placeholder="Titre de l'offre" required>
          <label>URL Image</label>
          <input class="field" id="offerImage" placeholder="https://...">
          <label>Description</label>
          <textarea class="field" id="offerDesc" placeholder="Description..." rows="2" required></textarea>
          <button class="primary full" type="submit" style="margin-top:10px;">Enregistrer Offre</button>
        </form>
        <div style="margin-top: 15px;" id="adminOffersList"></div>
      </div>

      <div class="admin-section">
        <h3 style="margin-top:0; font-size:15px;">📅 Historique des Visites</h3>
        <div style="overflow-x: auto;">
          <table class="history-table">
            <thead>
              <tr>
                <th>Date / Heure</th>
                <th>Client</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
              <tr><td colspan="3" style="text-align:center;">Chargement...</td></tr>
            </tbody>
          </table>
        </div>
      </div>`;

    supabaseClient.from('profiles').select('*', { count: 'exact', head: true }).then(({ count }) => {
      if ($('statMembers'))$('statMembers').textContent = count || 0;
    });
    supabaseClient.from('visits').select('*', { count: 'exact', head: true }).then(({ count }) => {
      if ($('statVisits'))$('statVisits').textContent = count || 0;
    });

    loadAdminManagementLists();
    loadVisitsHistory();
  }
}

async function loadAdminManagementLists() {
  await loadContentData();
  
  const evContainer = $("adminEventsList");
  if (evContainer) {
    evContainer.innerHTML = eventsList.map(e => `
      <div style="display:flex; justify-content:space-between; align-items:center; background:var(--cream); padding:8px 12px; border-radius:8px; margin-bottom:6px; font-size:13px;">
        <div><strong>${escapeHTML(e.title)}</strong></div>
        <div style="display:flex; gap:6px;">
          <button class="outline" onclick="editEvent('${e.id}', '${escapeHTML(e.title)}', '${escapeHTML(e.description)}', '${escapeHTML(e.image_url || '')}')" style="padding:4px 8px; font-size:11px;">Édit</button>
          <button class="danger-btn" onclick="deleteItem('events', '${e.id}')">Suppr</button>
        </div>
      </div>
    `).join("") || '<p class="muted">Aucune soirée.</p>';
  }

  const offContainer = $("adminOffersList");
  if (offContainer) {
    offContainer.innerHTML = offersList.map(o => `
      <div style="display:flex; justify-content:space-between; align-items:center; background:var(--cream); padding:8px 12px; border-radius:8px; margin-bottom:6px; font-size:13px;">
        <div><strong>${escapeHTML(o.title)}</strong></div>
        <div style="display:flex; gap:6px;">
          <button class="outline" onclick="editOffer('${o.id}', '${escapeHTML(o.title)}', '${escapeHTML(o.description)}', '${escapeHTML(o.image_url || '')}')" style="padding:4px 8px; font-size:11px;">Édit</button>
          <button class="danger-btn" onclick="deleteItem('offers', '${o.id}')">Suppr</button>
        </div>
      </div>
    `).join("") || '<p class="muted">Aucune offre.</p>';
  }
}

async function saveEvent(e) {
  e.preventDefault();
  const id = $("eventId").value;
  const title = $("eventTitle").value;
  const image_url = $("eventImage").value;
  const description = $("eventDesc").value;

  if (id) {
    await supabaseClient.from('events').update({ title, image_url, description }).eq('id', id);
  } else {
    await supabaseClient.from('events').insert({ title, image_url, description, is_published: true });
  }
  $("eventForm").reset();
  $("eventId").value = "";
  loadAdminManagementLists();
}

function editEvent(id, title, desc, img) {
  $("eventId").value = id;
  $("eventTitle").value = title;
  $("eventImage").value = img;
  $("eventDesc").value = desc;
}

async function saveOffer(e) {
  e.preventDefault();
  const id = $("offerId").value;
  const title = $("offerTitle").value;
  const image_url = $("offerImage").value;
  const description = $("offerDesc").value;

  if (id) {
    await supabaseClient.from('offers').update({ title, image_url, description }).eq('id', id);
  } else {
    await supabaseClient.from('offers').insert({ title, image_url, description, is_published: true });
  }
  $("offerForm").reset();
  $("offerId").value = "";
  loadAdminManagementLists();
}

function editOffer(id, title, desc, img) {
  $("offerId").value = id;
  $("offerTitle").value = title;
  $("offerImage").value = img;
  $("offerDesc").value = desc;
}

async function deleteItem(table, id) {
  if (confirm("Supprimer cet élément ?")) {
    await supabaseClient.from(table).delete().eq('id', id);
    loadAdminManagementLists();
  }
}

async function loadVisitsHistory() {
  const tbody = $("historyTableBody");
  if (!tbody) return;

  const { data: visits, error } = await supabaseClient
    .from('visits')
    .select('created_at, user_id, profiles(full_name)')
    .order('created_at', { ascending: false });

  if (error || !visits || visits.length === 0) {
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;" class="muted">Aucune visite.</td></tr>`;
    return;
  }

  tbody.innerHTML = visits.map(v => {
    const dateObj = new Date(v.created_at);
    const dateFormatted = dateObj.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
    const timeFormatted = dateObj.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    const clientName = v.profiles?.full_name || "Client";

    return `
      <tr>
        <td>${dateFormatted} à ${timeFormatted}</td>
        <td><strong>${escapeHTML(clientName)}</strong></td>
        <td><span style="color:var(--success); font-weight:bold;">Validé (-20% & Tampon)</span></td>
      </tr>
    `;
  }).join("");
}

function startCameraScan() {
  const btn = $("startScanBtn");
  btn.textContent = "Caméra active...";
  btn.disabled = true;

  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 220, height: 220 } },
    async (decodedText) => {
      $("scanInput").value = decodedText;
      await searchAndValidateMember(decodedText);
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
        btn.textContent = "Activer la caméra";
        btn.disabled = false;
      }
    },
    (errorMessage) => {}
  ).catch(err => {
    alert("Erreur caméra : " + err);
    btn.textContent = "Activer la caméra";
    btn.disabled = false;
  });
}

async function searchAndValidateMember(token) {
  const res = $("scanResult");
  if (!token) {
    alert("Entrez un token valide.");
    return;
  }

  res.classList.remove("hidden");
  res.innerHTML = "Vérification...";

  const { data: card, error } = await supabaseClient
    .from('loyalty_cards')
    .select('*, profiles(full_name)')
    .eq('qr_token', token)
    .maybeSingle();

  if (error || !card) {
    res.innerHTML = `❌ Client introuvable. Code QR invalide.`;
    return;
  }

  let currentStamps = card.points || 0;
  currentStamps += 1;
  const isGift = currentStamps >= 6;

  await supabaseClient.from('visits').insert({ user_id: card.user_id });

  const newStampsCount = isGift ? 0 : currentStamps;
  await supabaseClient.from('loyalty_cards').update({ points: newStampsCount }).eq('id', card.id);

  let msg = isGift 
    ? `🎉 <strong>6ème Tampon !</strong> Offrez un <strong>café gratuit</strong> à <strong>${escapeHTML(card.profiles?.full_name)}</strong> (Carte réinitialisée à 0).`
    : `✅ <strong>Discount 20% & Tampon validé !</strong> (${currentStamps}/6 tampons pour <strong>${escapeHTML(card.profiles?.full_name)}</strong>).`;

  res.innerHTML = msg;

  loadVisitsHistory();
  supabaseClient.from('visits').select('*', { count: 'exact', head: true }).then(({ count }) => {
    if ($('statVisits'))$('statVisits').textContent = count || 0;
  });
}

let wheelRotation = 0;

function spinWheel() {
  const wheelSvg = $("wheelSvg");
  const btn = $("spinBtn");
  const resultBox = $("wheelResult");

  const lastPlayedKey = "flamingo_wheel_" + currentUser.id;
  const today = new Date().toISOString().split('T')[0];
  const lastPlayedDate = localStorage.getItem(lastPlayedKey);

  if (lastPlayedDate === today) {
    resultBox.innerHTML = "⏳ <strong>Déjà joué aujourd'hui !</strong> Revenez demain 😉";
    resultBox.classList.remove("hidden");
    return;
  }

  btn.disabled = true;
  resultBox.classList.add("hidden");

  const prizes = [
    { text: "☕ Café offert !", angle: 315 },
    { text: "🥐 Croissant offert !", angle: 225 },
    { text: "🍹 Cocktail à -50% !", angle: 135 },
    { text: "🎉 Dommage, retentez demain !", angle: 45 }
  ];

  const selectedPrize = prizes[Math.floor(Math.random() * prizes.length)];
  const fullRounds = 5 * 360;
  wheelRotation += fullRounds + selectedPrize.angle - (wheelRotation % 360);
  
  wheelSvg.style.transform = "rotate(" + wheelRotation + "deg)";

  setTimeout(() => {
    localStorage.setItem(lastPlayedKey, today);

    resultBox.innerHTML = "🎁 <strong>Résultat :</strong> " + selectedPrize.text + "<br><small>Montrez l'écran au comptoir !</small>";
    resultBox.classList.remove("hidden");
    btn.disabled = false;
  }, 4000);
}

if (supabaseClient) {
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      loadUserDataAndEnterApp(session.user);
    }
  });
}

setMode("login");
</script>
