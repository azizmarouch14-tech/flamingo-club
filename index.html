<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#AD7966">
<title>Flamingo Café-Restaurant | Club</title>

<!-- SDK Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --terracotta: #AD7966;
  --terracotta-dark: #865747;
  --terracotta-light: #D0A18D;
  --beige: #E9D8CB;
  --cream: #FBF7F2;
  --white: #FFFFFF;
  --text: #382A25;
  --muted: #86736A;
  --border: #E8DCD3;
  --success: #2e7d32;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--cream);
  color: var(--text);
}

button, input { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--terracotta);
  outline-offset: 3px;
}

/* AUTHENTIFICATION */
.auth-screen {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 35px;
  padding: 35px;
  background: linear-gradient(135deg, #93634F, #C39A85);
}

.brand {
  color: white;
  text-align: center;
  padding: 20px;
}

.brand img {
  width: min(100%, 440px);
  display: block;
  margin: auto;
  border-radius: 8px;
}

.brand h1 {
  font-size: 35px;
  letter-spacing: 5px;
  font-weight: 400;
  margin: 25px 0 10px;
}

.brand p {
  line-height: 1.8;
  max-width: 400px;
  margin: auto;
  color: #FFF4EC;
}

.auth-card {
  width: 100%;
  max-width: 450px;
  margin: auto;
  background: white;
  padding: 35px;
  border-radius: 20px;
  box-shadow: 0 15px 50px #57372825;
}

.auth-card h2 { margin-top: 0; }

.subtitle {
  color: var(--muted);
  line-height: 1.6;
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin: 24px 0;
  background: var(--cream);
  padding: 5px;
  border-radius: 10px;
}

.tabs button {
  flex: 1;
  border: none;
  padding: 12px 5px;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
}

.tabs button.active {
  background: var(--terracotta);
  color: white;
}

label {
  display: block;
  font-size: 13px;
  font-weight: bold;
  margin: 15px 0 7px;
}

.field {
  width: 100%;
  border: 1px solid var(--border);
  background: #FFFCF9;
  border-radius: 9px;
  padding: 13px;
}

.primary {
  background: var(--terracotta);
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 9px;
  font-weight: bold;
}

.primary:hover { background: var(--terracotta-dark); }
.full { width: 100%; margin-top: 20px; }

.message {
  margin-top: 12px;
  color: var(--terracotta-dark);
  font-size: 13px;
  line-height: 1.6;
}

/* APPLICATION */
.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  min-height: 75px;
  padding: 12px 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: bold;
  letter-spacing: 2px;
  color: var(--terracotta-dark);
}

.logo img {
  width: 55px;
  height: 48px;
  object-fit: contain;
}

.user-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  background: var(--beige);
  color: var(--terracotta-dark);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: bold;
}

.outline {
  background: white;
  border: 1px solid var(--border);
  color: var(--terracotta-dark);
  border-radius: 8px;
  padding: 9px 12px;
}

.layout {
  max-width: 1400px;
  margin: auto;
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
}

.sidebar {
  background: white;
  border-right: 1px solid var(--border);
  min-height: calc(100vh - 75px);
  padding: 25px 13px;
}

.nav-btn {
  width: 100%;
  display: flex;
  gap: 12px;
  align-items: center;
  text-align: left;
  padding: 14px;
  margin-bottom: 6px;
  border: none;
  border-radius: 9px;
  color: var(--muted);
  background: transparent;
  font-weight: bold;
}

.nav-btn.active, .nav-btn:hover {
  background: var(--beige);
  color: var(--terracotta-dark);
}

.content {
  min-width: 0;
  padding: 35px;
}

.hero {
  background: linear-gradient(120deg, #98664F, #C49A83);
  color: white;
  padding: 38px;
  border-radius: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.hero small { letter-spacing: 3px; font-weight: bold; }
.hero h1 { font-size: clamp(28px, 4vw, 43px); margin: 15px 0; font-weight: 500; }
.hero p { line-height: 1.7; color: #FFF1E8; }
.hero .primary { background: var(--cream); color: var(--terracotta-dark); }
.hero-symbol { font-size: 85px; }

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 30px 0 17px;
}
.section-heading h2 { margin: 0; font-size: 22px; }

.muted { color: var(--muted); font-size: 14px; line-height: 1.6; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }

.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.card-art {
  height: 135px;
  display: grid;
  place-items: center;
  font-size: 48px;
  background: linear-gradient(135deg, #E4C7B6, #F6EAE0);
}
.card-body { padding: 17px; }
.tag {
  display: inline-block;
  background: var(--beige);
  color: var(--terracotta-dark);
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: bold;
}
.card h3 { font-size: 17px; }
.card p { color: var(--muted); font-size: 13px; line-height: 1.6; }

/* SYSTEME DE TAMPONS DE FIDELITE (6 VISITES) */
.stamps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin: 25px 0;
  max-width: 500px;
}

.stamp-box {
  background: white;
  border: 2px dashed var(--terracotta-light);
  border-radius: 12px;
  height: 75px;
  display: grid;
  place-items: center;
  font-size: 24px;
  font-weight: bold;
  color: var(--muted);
}

.stamp-box.filled {
  background: var(--beige);
  border: 2px solid var(--terracotta);
  color: var(--terracotta-dark);
}

.stamp-box.gift {
  background: linear-gradient(135deg, #AD7966, #865747);
  color: white;
  border: 2px solid #865747;
}

/* ROUE DE LA CHANCE (JEU) */
.wheel-container {
  text-align: center;
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 30px;
  max-width: 500px;
  margin: auto;
}

.wheel {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 8px solid var(--terracotta);
  margin: 20px auto;
  display: grid;
  place-items: center;
  background: conic-gradient(
    #E9D8CB 0deg 60deg,
    #AD7966 60deg 120deg,
    #FBF7F2 120deg 180deg,
    #865747 180deg 240deg,
    #D0A18D 240deg 300deg,
    #382A25 300deg 360deg
  );
  font-size: 28px;
  transition: transform 4s cubic-bezier(0.15, 0.95, 0.15, 1);
}

.notice {
  background: #F4E8DE;
  border-radius: 10px;
  padding: 15px;
  margin: 20px 0;
  color: #755340;
  font-size: 13px;
  line-height: 1.7;
}

.profile-box {
  background: white;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 25px;
  max-width: 650px;
}

.footer {
  padding: 25px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}

/* MOBILE */
@media(max-width: 850px) {
  .auth-screen { grid-template-columns: 1fr; padding: 20px; gap: 10px; }
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; z-index: 10; bottom: 0; left: 0; right: 0;
    min-height: auto; display: flex; justify-content: space-around;
    padding: 7px 3px; background: white; border-top: 1px solid var(--border);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    font-size: 10px; padding: 8px 2px; margin: 0;
  }
  .content { padding: 20px 14px 100px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media(max-width: 520px) {
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<!-- CONNEXION -->
<section id="authScreen" class="auth-screen">
  <div class="brand">
    <img src="logo.png" alt="Flamingo Café-Restaurant">
    <h1>FLAMINGO CLUB</h1>
    <p>Votre moment, votre plaisir.</p>
  </div>

  <div class="auth-card">
    <h2 id="authTitle">Bienvenue !</h2>
    <p class="subtitle" id="authSubtitle">Connectez-vous à votre espace Flamingo.</p>

    <div class="tabs">
      <button id="loginTab" class="active" type="button">Connexion</button>
      <button id="registerTab" type="button">Créer un compte</button>
    </div>

    <form id="authForm">
      <div id="nameField" class="hidden">
        <label for="fullName">Nom complet</label>
        <input class="field" id="fullName" autocomplete="name" placeholder="Votre nom complet">
      </div>

      <label for="email">Adresse e-mail</label>
      <input class="field" id="email" type="email" autocomplete="email" placeholder="vous@exemple.com" required>

      <label for="password">Mot de passe</label>
      <input class="field" id="password" type="password" minlength="6" autocomplete="current-password" placeholder="6 caractères minimum" required>

      <div id="confirmField" class="hidden">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input class="field" id="confirmPassword" type="password" minlength="6" placeholder="Répétez le mot de passe">
      </div>

      <button class="primary full" id="authSubmit" type="submit">
        Se connecter
      </button>
    </form>

    <div id="authMessage" class="message" role="status"></div>
  </div>
</section>

<!-- APPLICATION -->
<div id="appScreen" class="hidden">
  <header class="topbar">
    <div class="logo">
      <img src="logo.png" alt="Flamingo">
      <span>FLAMINGO CLUB</span>
    </div>
    <div class="user-actions">
      <div class="avatar" id="topUser">F</div>
      <button class="outline" id="logoutBtn" type="button">Déconnexion</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Navigation">
      <button class="nav-btn active" data-page="home">🏠 Accueil</button>
      <button class="nav-btn" data-page="events">🎶 Soirées</button>
      <button class="nav-btn" data-page="offers">✨ Offres</button>
      <button class="nav-btn" data-page="loyalty">💳 Fidélité</button>
      <button class="nav-btn" data-page="games">🎁 Jeux</button>
      <button class="nav-btn" data-page="profile">👤 Profil</button>
    </nav>
    <main id="mainContent" class="content"></main>
  </div>

  <footer class="footer">
    FLAMINGO CAFÉ-RESTAURANT · VOTRE MOMENT, VOTRE PLAISIR
  </footer>
</div>

<script>
const SUPABASE_URL = 'https://rwoirkuwvdgsgyxytfmu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_RXTtm3S7JyrmgEhe5aX85A_S5IGCheQ';

let supabaseClient = null;
if (window.supabase) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let mode = "login";
let currentUser = { name: "Membre Flamingo", email: "", id: "" };
let activePage = "home";
let eventsList = [];
let offersList = [];
let loyaltyData = { visits: 0 }; // 6 visites maximum avant cadeau

const $ = id => document.getElementById(id);

function setMode(nextMode) {
  mode = nextMode;
  const register = mode === "register";

  $("loginTab").classList.toggle("active", !register);
  $("registerTab").classList.toggle("active", register);

  $("nameField").classList.toggle("hidden", !register);
  $("confirmField").classList.toggle("hidden", !register);

  $("fullName").required = register;
  $("confirmPassword").required = register;

  $("authTitle").textContent = register ? "Rejoignez le club" : "Bienvenue !";
  $("authSubtitle").textContent = register ? "Créez votre compte Flamingo Club." : "Connectez-vous à votre espace Flamingo.";
  $("authSubmit").textContent = register ? "Créer mon compte" : "Se connecter";
  $("authMessage").textContent = "";
}

$("loginTab").addEventListener("click", () => setMode("login"));
$("registerTab").addEventListener("click", () => setMode("register"));

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!supabaseClient) {
    $("authMessage").textContent = "Erreur : Impossible de contacter Supabase.";
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;
  $("authMessage").textContent = "Traitement en cours...";

  if (mode === "register") {
    const fullName = $("fullName").value.trim();
    if (fullName.length < 2) {
      $("authMessage").textContent = "Entrez votre nom complet.";
      return;
    }
    if (password !== $("confirmPassword").value) {
      $("authMessage").textContent = "Les mots de passe ne correspondent pas.";
      return;
    }

    const { error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: { data: { full_name: fullName } }
    });

    if (error) {
      $("authMessage").textContent = "Erreur : " + error.message;
    } else {
      $("authMessage").textContent = "Compte créé ! Veuillez vous connecter.";
    }
  } else {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      $("authMessage").textContent = "Erreur de connexion : " + error.message;
    } else if (data.user) {
      await loadUserDataAndEnterApp(data.user);
    }
  }
});

async function loadUserDataAndEnterApp(user) {
  currentUser.email = user.email;
  currentUser.id = user.id;

  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('full_name')
    .eq('id', user.id)
    .maybeSingle();

  currentUser.name = profile?.full_name || user.email.split("@")[0];

  const { data: loyalty } = await supabaseClient
    .from('loyalty_cards')
    .select('points')
    .eq('user_id', user.id)
    .maybeSingle();

  if (loyalty) {
    // On utilise 'points' comme compteur de visites (de 0 à 6)
    loyaltyData.visits = Math.min(loyalty.points, 6);
  }

  const { data: evs } = await supabaseClient.from('events').select('*').eq('is_published', true);
  if (evs) eventsList = evs;

  const { data: offs } = await supabaseClient.from('offers').select('*').eq('is_published', true);
  if (offs) offersList = offs;

  $("authScreen").classList.add("hidden");
  $("appScreen").classList.remove("hidden");
  $("topUser").textContent = currentUser.name.charAt(0).toUpperCase();

  renderPage(activePage);
}

$("logoutBtn").addEventListener("click", async () => {
  if (supabaseClient) await supabaseClient.auth.signOut();
  $("appScreen").classList.add("hidden");
  $("authScreen").classList.remove("hidden");
  $("authMessage").textContent = "Vous avez été déconnecté.";
});

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[char]);
}

function card(item) {
  return `
    <article class="card">
      <div class="card-art">✨</div>
      <div class="card-body">
        <span class="tag">FLAMINGO</span>
        <h3>${escapeHTML(item.title)}</h3>
        <p>${escapeHTML(item.description)}</p>
      </div>
    </article>`;
}

function goPage(page) {
  activePage = page;
  document.querySelectorAll(".nav-btn").forEach(button => {
    button.classList.toggle("active", button.dataset.page === page);
  });
  renderPage(page);
}

document.querySelectorAll(".nav-btn").forEach(button => {
  button.addEventListener("click", () => goPage(button.dataset.page));
});

function renderPage(page) {
  const main = $("mainContent");

  if (page === "home") {
    main.innerHTML = `
      <section class="hero">
        <div>
          <small>BIENVENUE AU FLAMINGO CLUB</small>
          <h1>Votre moment,<br>votre plaisir.</h1>
          <p>Bonjour ${escapeHTML(currentUser.name)} ! Découvrez nos soirées et vos offres Flamingo.</p>
          <button class="primary" onclick="goPage('offers')">Découvrir les offres</button>
        </div>
        <div class="hero-symbol">☕</div>
      </section>

      <div class="section-heading">
        <div><h2>Les soirées</h2><p class="muted">Les bons moments commencent ici.</p></div>
        <button class="outline" onclick="goPage('events')">Tout voir</button>
      </div>
      <div class="cards">${eventsList.slice(0,2).map(card).join("") || '<p class="muted">Aucune soirée pour le moment.</p>'}</div>

      <div class="section-heading">
        <div><h2>Les offres</h2><p class="muted">Des plaisirs à partager.</p></div>
        <button class="outline" onclick="goPage('offers')">Tout voir</button>
      </div>
      <div class="cards">${offersList.slice(0,2).map(card).join("") || '<p class="muted">Aucune offre pour le moment.</p>'}</div>`;
  } else if (page === "events") {
    main.innerHTML = `
      <div class="section-heading"><h2>Les soirées Flamingo</h2></div>
      <div class="cards">${eventsList.map(card).join("") || '<p class="muted">Aucune soirée publiée.</p>'}</div>`;
  } else if (page === "offers") {
    main.innerHTML = `
      <div class="section-heading"><h2>Les offres Flamingo</h2></div>
      <div class="cards">${offersList.map(card).join("") || '<p class="muted">Aucune offre publiée.</p>'}</div>`;
  } else if (page === "loyalty") {
    // Génération des 6 cases de tampons
    let stampsHTML = "";
    for (let i = 1; i <= 6; i++) {
      const isFilled = i <= loyaltyData.visits;
      const isGift = i === 6;
      let cssClass = isGift ? "stamp-box gift" : (isFilled ? "stamp-box filled" : "stamp-box");
      let content = isGift ? "🎁" : (isFilled ? "✓" : i);
      stampsHTML += `<div class="${cssClass}">${content}</div>`;
    }

    let statusMsg = loyaltyData.visits >= 6 
      ? "🎉 Félicitations ! Vous avez atteint 6 visites. Présentez votre carte au comptoir pour recevoir votre cadeau !" 
      : `Il vous reste ${6 - loyaltyData.visits} visite(s) avant de débloquer votre cadeau !`;

    main.innerHTML = `
      <div class="section-heading"><h2>Ma carte de fidélité (6 Visites)</h2></div>
      <div class="profile-box">
        <h3>${escapeHTML(currentUser.name)}</h3>
        <p class="muted">Tampons de visites validés par le restaurant.</p>
        <div class="stamps-grid">${stampsHTML}</div>
        <div class="notice">${statusMsg}</div>
      </div>`;
  } else if (page === "games") {
    main.innerHTML = `
      <div class="section-heading"><h2>Roue de la Chance - Lucky Wheel</h2></div>
      <div class="wheel-container">
        <p class="muted">Tournez la roue pour tenter de gagner une surprise Flamingo !</p>
        <div id="wheel" class="wheel">🎡</div>
        <button class="primary" id="spinBtn" onclick="spinWheel()">Tourner la roue</button>
        <div id="wheelResult" class="notice hidden" style="margin-top:20px"></div>
      </div>`;
  } else if (page === "profile") {
    main.innerHTML = `
      <div class="section-heading"><h2>Mon profil</h2></div>
      <div class="profile-box">
        <div class="avatar">${escapeHTML(currentUser.name[0].toUpperCase())}</div>
        <label>Nom complet</label>
        <input class="field" value="${escapeHTML(currentUser.name)}" readonly>
        <label>Adresse e-mail</label>
        <input class="field" value="${escapeHTML(currentUser.email)}" readonly>
      </div>`;
  }
}

function spinWheel() {
  const wheel = $("wheel");
  const btn = $("spinBtn");
  const resultBox = $("wheelResult");

  btn.disabled = true;
  resultBox.classList.add("hidden");

  // Animation de rotation aléatoire (entre 4 et 8 tours complets + un angle)
  const randomDegree = Math.floor(2000 + Math.random() * 2000);
  wheel.style.transform = `rotate(${randomDegree}deg)`;

  setTimeout(() => {
    const gifts = [
      "☕ Un café offert !", 
      "🥐 Une viennoiserie gratuite !", 
      "🍹 -50% sur votre cocktail !", 
      "🎉 Ret try again (Retente ta chance !)"
    ];
    const won = gifts[Math.floor(Math.random() * gifts.length)];
    resultBox.textContent = `🎁 Résultat : ${won}`;
    resultBox.classList.remove("hidden");
    btn.disabled = false;
  }, 4000);
}

if (supabaseClient) {
  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      loadUserDataAndEnterApp(session.user);
    }
  });
}

setMode("login");
</script>

</body>
</html>
